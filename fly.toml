# Fly.io settings for the How AI Works course. `fly launch` adds the app name.
primary_region = 'ord'

[http_service]
  internal_port = 8080        # nginx is set to listen on 8080 (see nginx.conf)
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
