# Fly.io settings for the How AI Works course. `fly launch` adds the app name.
primary_region = 'ord'

[http_service]
  internal_port = 80          # nginx listens on 80; Fly's default assumes 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
