<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samples and uncertainty: how much to trust a number</title>
<style>/* Lesson player: one idea per screen, do first, then explain. */
:root {
  --paper: #FBF7F0; --card: #FFFFFF; --ink: #1D1B22; --ink-2: #45424D; --mute: #7C7884; --rule: #E8E1D5; --edge: #1D1B22;
  --brand: #5546FF; --brand-soft: #ECEAFF;
  --ok: #188A4A; --ok-bg: #E2F5E9; --ok-edge: #0F6A37; --no: #D93A50; --no-bg: #FCE6E9; --no-edge: #A82337;
  --c1: #FF8A3D; --c2: #14A39B; --c3: #7B61FF; --c4: #FFC23D; --c5: #F2547D;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Avenir Next", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #16151A; --card: #201E26; --ink: #F4F0E8; --ink-2: #CFCAD5; --mute: #9C97A6; --rule: #322F3A; --edge: #000000;
    --brand: #8B80FF; --brand-soft: #2A2650; --ok: #3CC777; --ok-bg: #12301F; --ok-edge: #0B1F14; --no: #FF6B7F; --no-bg: #3A1B22; --no-edge: #24090F; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; }
.lp { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
.lp-top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--paper); }
.lp-x { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--rule); background: transparent; color: var(--mute); font-size: 1rem; font-weight: 800; cursor: pointer; flex: none; }
.lp-x:hover { color: var(--ink); border-color: var(--ink); }
.lp-prog { flex: 1; display: flex; gap: 5px; }
.lp-prog span { flex: 1; height: 10px; border-radius: 6px; background: var(--rule); transition: background .3s; }
.lp-prog span { background: linear-gradient(90deg, var(--brand) 0 var(--f, 0%), var(--rule) var(--f, 0%)); }
.lp-prog span.done { background: var(--brand); }
.lp-main { width: min(720px, 100%); margin: 0 auto; padding: 10px 20px 190px; outline: none; }
.scr { display: grid; gap: 18px; animation: lp-in .35s ease both; }
@keyframes lp-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .scr { animation: none; } }
.eyebrow { font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); margin: 0; }
.scr h1 { font-size: clamp(1.55rem, 4.2vw, 2.15rem); line-height: 1.15; margin: 0; letter-spacing: -.015em; font-weight: 850; }
.txt { font-size: 1.16rem; line-height: 1.58; color: var(--ink-2); }
.txt p { margin: 0 0 .55em; } .txt p:last-child { margin: 0; }
.txt b { color: var(--ink); }
.vis { background: var(--card); border: 2px solid var(--rule); border-radius: 24px; padding: 18px; display: grid; gap: 14px; }
.vis.bare { background: transparent; border: 0; padding: 0; }
/* tactile buttons and tiles */
.btn3d { font-weight: 800; font-size: 1.04rem; padding: 13px 24px; border-radius: 16px; border: 2px solid var(--edge); background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--edge); cursor: pointer; transition: transform .05s, box-shadow .05s; }
.btn3d:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.btn3d.primary { background: var(--ink); color: var(--paper); min-width: 170px; }
@media (prefers-color-scheme: dark) { .btn3d.primary { background: var(--brand); color: #fff; border-color: #2B2380; box-shadow: 0 4px 0 #2B2380; } .btn3d { border-color: #3D3946; box-shadow: 0 4px 0 #0B0A0E; } }
.btn3d:disabled { opacity: .35; cursor: default; }
.tiles { display: grid; gap: 12px; }
.tile { text-align: left; font-size: 1.07rem; line-height: 1.4; padding: 15px 18px; border-radius: 16px; background: var(--card); color: var(--ink); border: 2px solid var(--rule); box-shadow: 0 4px 0 var(--rule); cursor: pointer; display: flex; gap: 12px; align-items: center; transition: transform .05s, box-shadow .05s, border-color .15s; }
.tile:hover:not(:disabled) { border-color: var(--ink-2); }
.tile:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--rule); }
.tile .key { flex: none; width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--rule); display: grid; place-items: center; font-size: .82rem; font-weight: 800; color: var(--mute); }
.tile.sel { border-color: var(--brand); box-shadow: 0 4px 0 var(--brand); background: var(--brand-soft); }
.tile.sel .key { border-color: var(--brand); background: var(--brand); color: #fff; }
.tile.ok { border-color: var(--ok); box-shadow: 0 4px 0 var(--ok); background: var(--ok-bg); }
.tile.ok .key { border-color: var(--ok); background: var(--ok); color: #fff; }
.tile.no { border-color: var(--no); box-shadow: 0 4px 0 var(--no); background: var(--no-bg); }
.tile.no .key { border-color: var(--no); background: var(--no); color: #fff; }
.tile:disabled { cursor: default; }
/* segmented toggle */
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; padding: 5px; border-radius: 16px; background: var(--rule); }
.seg button { border: 0; background: transparent; color: var(--ink-2); font-weight: 800; padding: 9px 16px; border-radius: 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--edge); }
/* chunky slider */
.slide { display: grid; gap: 8px; }
.slide label { font-weight: 800; display: flex; justify-content: space-between; gap: 10px; }
.slide label output { font-family: var(--mono); color: var(--brand); }
.slide input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; border-radius: 10px; background: var(--rule); outline: none; }
.slide input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: var(--brand); border: 3px solid var(--card); box-shadow: 0 0 0 2px var(--brand), 0 3px 0 2px var(--edge); cursor: grab; }
.slide input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--brand); border: 3px solid var(--card); box-shadow: 0 0 0 2px var(--brand); cursor: grab; }
/* numbers */
.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.num { border-radius: 16px; background: var(--paper); padding: 12px 14px; display: grid; gap: 2px; }
.num span { font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.num b { font-size: 1.75rem; font-weight: 850; letter-spacing: -.02em; }
.num small { color: var(--mute); }
.num.hl b { color: var(--brand); } .num.bad b { color: var(--no); } .num.good b { color: var(--ok); }
/* charts */
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { font: 600 12px var(--font); fill: var(--mute); }
svg.chart .axl { font-weight: 800; fill: var(--ink-2); }
svg.chart .lbl { font-weight: 800; font-size: 13px; }
/* data table */
.dt { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: .95rem; }
.dt th { text-align: left; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); padding: 0 10px; }
.dt td { background: var(--paper); padding: 10px; border-top: 2px solid transparent; border-bottom: 2px solid transparent; }
.dt td:first-child { border-left: 2px solid transparent; border-radius: 12px 0 0 12px; font-family: var(--mono); font-size: .85rem; }
.dt td:last-child { border-right: 2px solid transparent; border-radius: 0 12px 12px 0; text-align: right; width: 34px; }
.dt tr.row { cursor: pointer; }
.dt tr.row:hover td { border-color: var(--rule); }
.dt tr.flag td { background: var(--no-bg); border-color: var(--no); }
.dt tr.fixed td { background: var(--ok-bg); }
.dt tr.gone td { opacity: .45; text-decoration: line-through; }
.dtw { overflow-x: auto; }
/* bottom bar and feedback */
.lp-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--paper); border-top: 2px solid var(--rule); transition: background .2s; }
.lp-bar.ok { background: var(--ok-bg); border-top-color: var(--ok); }
.lp-bar.no { background: var(--no-bg); border-top-color: var(--no); }
.lp-inner { width: min(720px, 100%); margin: 0 auto; padding: 14px 20px 18px; display: grid; gap: 12px; }
.lp-fb { display: none; animation: lp-up .25s ease both; }
@keyframes lp-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.lp-bar.ok .lp-fb, .lp-bar.no .lp-fb { display: grid; gap: 4px; }
.lp-fb h3 { margin: 0; font-size: 1.3rem; font-weight: 850; display: flex; align-items: center; gap: 10px; }
.lp-bar.ok .lp-fb h3 { color: var(--ok); } .lp-bar.no .lp-fb h3 { color: var(--no); }
.lp-fb p { margin: 0; font-size: 1.02rem; line-height: 1.5; color: var(--ink-2); }
.lp-badge { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 1rem; }
.lp-bar.ok .lp-badge { background: var(--ok); } .lp-bar.no .lp-badge { background: var(--no); }
.lp-actions { display: flex; gap: 12px; justify-content: space-between; align-items: center; }
.lp-back { border: 0; background: transparent; color: var(--mute); font-weight: 800; cursor: pointer; padding: 10px 4px; }
.lp-back:hover { color: var(--ink); }
.lp-bar.ok .btn3d.primary { background: var(--ok); border-color: var(--ok-edge); box-shadow: 0 4px 0 var(--ok-edge); color: #fff; }
.lp-bar.no .btn3d.primary { background: var(--no); border-color: var(--no-edge); box-shadow: 0 4px 0 var(--no-edge); color: #fff; }
/* illustration helpers */
.chatcard { display: grid; gap: 12px; }
.chatrow { display: flex; gap: 12px; align-items: flex-start; }
.avatar { width: 44px; height: 44px; flex: none; border-radius: 14px; background: var(--c3); display: grid; place-items: center; border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); }
.bubble2 { background: var(--paper); border-radius: 4px 18px 18px 18px; padding: 14px 16px; font-size: 1.05rem; line-height: 1.5; }
.bubble2 .big { display: block; font-size: 2.6rem; font-weight: 900; letter-spacing: -.03em; color: var(--ink); line-height: 1.1; margin-top: 4px; }
.sticker { justify-self: end; transform: rotate(-4deg); background: var(--c4); color: #1D1B22; font-weight: 850; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); }
.recap { display: grid; gap: 12px; }
.recap div { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; background: var(--card); border: 2px solid var(--rule); border-radius: 18px; padding: 14px; }
.recap i { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-style: normal; font-size: 1.4rem; font-weight: 900; color: #1D1B22; border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); }
.recap b { display: block; font-size: 1.08rem; } .recap span { color: var(--ink-2); line-height: 1.45; }
.legend2 { display: flex; flex-wrap: wrap; gap: 14px; font-weight: 700; font-size: .9rem; color: var(--ink-2); }
.legend2 i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--edge); margin-right: 6px; vertical-align: -2px; }
.quote { font-size: 1.15rem; font-weight: 700; padding: 14px 18px; border-left: 5px solid var(--c4); background: var(--card); border-radius: 0 16px 16px 0; }
.score { text-align: center; display: grid; gap: 6px; padding: 10px; }
.score b { font-size: 3rem; font-weight: 900; letter-spacing: -.03em; color: var(--brand); }
@media (max-width: 560px) { .txt { font-size: 1.07rem; } .lp-main { padding-bottom: 210px; } .btn3d.primary { min-width: 0; flex: 1; } }

@media (max-width: 560px) {
  .dt { font-size: .8rem; border-spacing: 0 5px; }
  .dt td { padding: 8px 5px; }
  .dt th { padding: 0 5px; font-size: .62rem; }
  .dt td:first-child { font-size: .72rem; }
  .dt td:last-child, .dt th:last-child { display: none; }
  .dt td:nth-last-child(2) { border-right: 2px solid transparent; border-radius: 0 12px 12px 0; }
  .dt tr.flag td:nth-last-child(2) { border-right-color: var(--no); }
}
@media (max-width: 560px) { svg.chart text { font-size: 19px; } svg.chart .lbl { font-size: 20px; } }

/* ---------- chapters in the top bar ---------- */
.lp-pw { flex: 1; display: grid; gap: 6px; min-width: 0; }
.lp-chap { display: flex; gap: 8px; align-items: baseline; font-size: .78rem; font-weight: 800; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lp-chap b { color: var(--ink); }
.lp-chap span:not(:empty)::before { content: '·'; margin-right: 8px; }
.lp-prog { gap: 6px; }
.lp-prog span { height: 10px; border-radius: 6px; }

/* ---------- concept blocks ---------- */
.bigidea { display: grid; gap: 6px; padding: 22px; border-radius: 22px; background: var(--brand); color: #fff; border: 2px solid var(--edge); box-shadow: 0 5px 0 var(--edge); }
.bigidea b { font-size: clamp(1.25rem, 3.4vw, 1.6rem); line-height: 1.25; font-weight: 850; letter-spacing: -.01em; }
.bigidea span { opacity: .9; line-height: 1.5; }
.terms2 { display: grid; gap: 10px; }
.terms2 div { display: grid; grid-template-columns: minmax(110px, 180px) 1fr; gap: 14px; padding: 12px 14px; border-radius: 16px; background: var(--paper); align-items: baseline; }
.terms2 b { font-weight: 850; } .terms2 span { color: var(--ink-2); line-height: 1.45; }
.myth2 { display: grid; gap: 8px; }
.myth2 p { margin: 0; padding: 12px 14px; border-radius: 16px; line-height: 1.45; display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: baseline; }
.myth2 p:first-child { background: var(--no-bg); } .myth2 p:last-child { background: var(--ok-bg); }
.myth2 .m, .myth2 .f { font-size: .72rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
.myth2 .m { color: var(--no); } .myth2 .f { color: var(--ok); }
.pics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.pic { border-radius: 18px; padding: 14px; background: var(--paper); display: grid; gap: 6px; align-content: start; }
.pic i { font-style: normal; width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-weight: 900; font-size: 1.1rem; color: #1D1B22; border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); }
.pic b { font-size: 1.02rem; } .pic span { color: var(--ink-2); font-size: .95rem; line-height: 1.45; }
.flow2 { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.flow2 > div { flex: 1 1 120px; border-radius: 16px; padding: 12px; background: var(--paper); display: grid; gap: 4px; align-content: start; border: 2px solid transparent; }
.flow2 > div.hl { border-color: var(--brand); background: var(--brand-soft); }
.flow2 > i { align-self: center; font-style: normal; font-weight: 900; color: var(--mute); }
.flow2 b { font-size: .98rem; } .flow2 span { font-size: .88rem; color: var(--ink-2); line-height: 1.4; }
.flow2 em { font-style: normal; font-size: .72rem; font-weight: 900; color: var(--brand); }
@media (max-width: 560px) { .flow2 { flex-direction: column; } .flow2 > i { transform: rotate(90deg); align-self: center; } .terms2 div { grid-template-columns: 1fr; gap: 2px; } }

/* ---------- activities ---------- */
.act-lbl { margin: 0; font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.chip3d { font: inherit; font-weight: 700; font-size: .98rem; line-height: 1.35; text-align: left; padding: 11px 14px; border-radius: 14px; background: var(--card); color: var(--ink); border: 2px solid var(--rule); box-shadow: 0 3px 0 var(--rule); cursor: pointer; display: flex; gap: 10px; align-items: center; transition: transform .05s, box-shadow .05s; }
.chip3d:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--rule); }
.chip3d:hover { border-color: var(--ink-2); }
.chip3d .n { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-size: .8rem; font-weight: 900; }
.chip3d.sel { border-color: var(--brand); box-shadow: 0 3px 0 var(--brand); background: var(--brand-soft); }
.chip3d.ok { border-color: var(--ok); box-shadow: 0 3px 0 var(--ok); background: var(--ok-bg); }
.chip3d.ok .n { background: var(--ok); color: #fff; }
.chip3d.no { border-color: var(--no); box-shadow: 0 3px 0 var(--no); background: var(--no-bg); }
.chip3d.no .n { background: var(--no); color: #fff; }
.chip3d .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--pc); border: 2px solid var(--edge); }
.chip3d[style*="--pc"]:not(.ok):not(.no) { border-color: var(--pc); box-shadow: 0 3px 0 var(--pc); }
.act-ord { display: grid; gap: 14px; }
.act-ord .pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; padding: 12px; border-radius: 18px; background: var(--paper); }
.act-done { color: var(--mute); font-weight: 700; align-self: center; }
.act-ord .placed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.act-ord .placed .chip3d { width: 100%; }
.act-ord .slot { height: 50px; border-radius: 14px; border: 2px dashed var(--rule); display: flex; align-items: center; padding-left: 14px; }
.act-ord .slot span { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--rule); display: grid; place-items: center; font-size: .8rem; font-weight: 900; color: var(--mute); }
.act-match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.act-match .col { display: grid; gap: 8px; align-content: start; }
.act-match .chip3d { width: 100%; min-height: 54px; }
.act-sort, .act-pick { display: grid; gap: 10px; }
.sitem, .pitem { display: grid; gap: 10px; padding: 14px; border-radius: 18px; background: var(--paper); border: 2px solid transparent; }
.sitem p { margin: 0; font-weight: 700; line-height: 1.4; }
.sitem.ok, .pitem.ok { border-color: var(--ok); background: var(--ok-bg); }
.sitem.no { border-color: var(--no); background: var(--no-bg); }
.sitem small, .pitem small { color: var(--ink-2); line-height: 1.45; font-size: .92rem; }
.sitem .seg { justify-self: start; }
.words2 { display: flex; flex-wrap: wrap; gap: 6px; }
.words2 .w { font: inherit; font-weight: 700; padding: 7px 11px; border-radius: 11px; border: 2px solid var(--rule); background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--rule); cursor: pointer; }
.words2 .w.sel { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 2px 0 var(--brand); }
.words2 .w.ok { border-color: var(--ok); background: var(--ok-bg); box-shadow: 0 2px 0 var(--ok); }
.words2 .w.no { border-color: var(--no); background: var(--no-bg); box-shadow: 0 2px 0 var(--no); }
@media (max-width: 560px) { .act-match { gap: 8px; } .act-match .chip3d { font-size: .88rem; padding: 9px 10px; } }

/* ---------- finish screen ---------- */
.done-hero { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 18px 10px 6px; }
.done-hero .medal { width: 92px; height: 92px; border-radius: 30px; background: var(--c4); border: 3px solid var(--edge); box-shadow: 0 6px 0 var(--edge); display: grid; place-items: center; font-size: 2.6rem; transform: rotate(-6deg); animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes pop { from { transform: scale(.4) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(-6deg); opacity: 1; } }
.done-hero b { font-size: 2.2rem; font-weight: 900; letter-spacing: -.02em; color: var(--brand); }
.done-hero span { color: var(--ink-2); }
.upnext { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 18px; border: 2px dashed var(--brand); color: var(--ink-2); line-height: 1.45; }
.upnext b { color: var(--ink); }
/* equation cards: inputs → outputs */
.eqs { display: grid; gap: 12px; }
.eq { border-radius: 20px; padding: 16px; background: var(--paper); display: grid; gap: 10px; }
.eq.hl { background: var(--brand-soft); }
.eql { font-size: .78rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.eq.hl .eql { color: var(--brand); }
.eqr { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 900; color: var(--mute); font-size: 1.2rem; }
.eqr i { font-style: normal; font-size: 1rem; color: #1D1B22; padding: 9px 14px; border-radius: 12px; border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); }
/* ---------- pixel grids (CNN lesson) ---------- */
.cnn { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.cnn > div { display: grid; gap: 8px; min-width: 0; }
.cnn .act-lbl { text-align: center; }

    <button type="button" class="lp-mode" id="lpMode" role="switch" aria-checked="false" aria-label="Technical mode: show formulas and Python" title="Technical mode adds formulas and Python to key slides"><span class="lm-a" aria-hidden="true">Plain</span><span class="lm-sw" aria-hidden="true"><i></i></span><span class="lm-b" aria-hidden="true"><span class="lm-full">Technical</span><span class="lm-short">Tech</span></span></button>

    <div class="lp-fb" id="lpFb" aria-live="polite"></div>

  </div>
</footer>
<script>/* Lesson player: one screen at a time, do first, then explain.
   Screen types:
     concept  – read, then Continue
     choice   – pick one option, Check, instant feedback (options shown in a stable shuffled order)
     task     – interact until a goal is met, Check
     try      – host an interactive engine step from the module (optional goal)
     order / match / sort / pick – hands-on activities, Check
     recap    – end of lesson
   Messages to a parent page: {source:'ai-module', module, type:'progress'|'complete'|'exit'|'open', ...} */
const Lesson = (() => {
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const KEYS = 'ABCDEFGH';
  const PAIR = ['var(--c3)', 'var(--c1)', 'var(--c2)', 'var(--c5)', 'var(--c4)', '#3FA7F5', '#9BC53D', '#B06AB3'];
  const val = (v, ctx) => typeof v === 'function' ? v(ctx) : v;
  const hash = str => { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  function shuffle(n, key) { const idx = [...Array(n).keys()]; let h = hash(key); for (let i = n - 1; i > 0; i--) { h = (Math.imul(h ^ (h >>> 13), 1103515245) + 12345) >>> 0; const j = h % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; } if (n > 1 && idx.every((v, i) => v === i)) idx.push(idx.shift()); return idx; }
  const GRADED = ['choice', 'task', 'order', 'match', 'sort', 'pick'];

  function create(L) {
    const $ = s => document.querySelector(s);
    const main = $('#lpMain'), bar = $('#lpBar'), go = $('#lpGo'), back = $('#lpBack'), fb = $('#lpFb'), prog = $('#lpProg'), chap = $('#lpChap'), termsBtn = $('#lpTermsBtn'), termsBox = $('#lpTerms');
    const state = L.state || {};
    const LG = typeof LEGACY !== 'undefined' ? LEGACY : null;
    const screens = applyCurriculum(L, L.screens.filter(Boolean));
    const rec = screens.map(() => ({ pick: null, solved: false, tries: 0, a: {} }));
    let i = 0, mode = 'idle';
    const post = m => { try { if (window.parent !== window) window.parent.postMessage({ source: 'ai-module', module: L.id, ...m }, '*'); } catch (e) {} };
    const isGraded = s => GRADED.includes(s.type) || (s.type === 'try' && s.goal);
    const SLD = (typeof SLIDES !== 'undefined' && SLIDES[L.id]) || {};
    const slideOf = s => (!s.plain && typeof s.title === 'string' && SLD[s.title]) || null;
    // Plain | Technical mode: ?tech=1|0 wins (and is remembered), then the saved choice; the old ?deep=1 link means technical
    let TECHM = (() => { try { const q = new URLSearchParams(location.search), t = q.get('tech'); if (t === '1' || t === '0') { try { localStorage.setItem('howai-tech', t); } catch (e) {} return t === '1'; } if (q.get('deep') === '1') return true; return localStorage.getItem('howai-tech') === '1'; } catch (e) { return false; } })();
    const TCH = (typeof TECH !== 'undefined' && TECH[L.id]) || {};
    const techOf = s => (!s.plain && typeof s.title === 'string' && TCH[s.title]) || null;
    const PYKW = new Set('False None True and as assert break class continue def del elif else except finally for from global if import in is lambda not or pass raise return try while with yield'.split(' '));
    function pyHL(code) {
      const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|[rbfu]{0,2}"(?:\\.|[^"\\\n])*"|[rbfu]{0,2}'(?:\\.|[^'\\\n])*')|(\b\d[\d_]*\.?\d*(?:e[+-]?\d+)?\b)|([A-Za-z_]\w*)/g;
      let out = '', last = 0, m;
      while ((m = re.exec(code))) {
        out += esc(code.slice(last, m.index)); last = re.lastIndex;
        if (m[1]) out += `<span class="pc">${esc(m[1])}</span>`;
        else if (m[2]) out += `<span class="ps">${esc(m[2])}</span>`;
        else if (m[3]) out += `<span class="pn">${esc(m[3])}</span>`;
        else out += PYKW.has(m[4]) ? `<span class="pk">${m[4]}</span>` : (code[re.lastIndex] === '(' ? `<span class="pf">${m[4]}</span>` : m[4]);
      }
      return out + esc(code.slice(last));
    }
    function techHTML(t) {
      const ran = t.run === true;
      const code = t.code ? `<div class="tpcode"><div class="tpbar"><span class="tplang">Python</span><span class="tprun ${ran ? 'ok' : 'no'}">${ran ? '✓ Ran in our check' : 'Not run here · needs ' + esc(t.run)}</span><button type="button" class="tpcopy" data-copy>Copy</button></div><pre><code>${pyHL(t.code)}</code></pre>${t.out ? `<div class="tpout"><span>Output</span><pre>${esc(t.out)}</pre></div>` : ''}</div>` : '';
      return `<aside class="techp" aria-label="For technical learners"><div class="tph"><span class="tpl">For technical learners</span><b>${t.h}</b></div>`
        + (t.f ? `<div class="tpf">${t.f}</div>` : '') + (t.p ? `<p class="tpp">${t.p}</p>` : '') + code
        + (t.n && t.n.length ? `<ul class="tpn">${t.n.map(x => `<li>${x}</li>`).join('')}</ul>` : '')
        + (t.src ? `<p class="tpsrc"><span>Source</span>${t.src}</p>` : '') + '</aside>';
    }
    function placeTech() {
      const sec = main.querySelector('section.scr'); if (!sec) return;
      sec.querySelectorAll('.techp').forEach(e => e.remove());
      const s = screens[i], t = techOf(s); if (!TECHM || !t || !slideOf(s)) return;
      if (isGraded(s) && !rec[i].solved) return;      // never give away a graded answer: show it once solved
      if (predOf(s)) { const rv = sec.querySelector('.reveal'); if (rv) rv.insertAdjacentHTML('beforeend', techHTML(t)); return; }
      const m = sec.querySelector(':scope > details.more');
      if (m) m.insertAdjacentHTML('beforebegin', techHTML(t)); else sec.insertAdjacentHTML('beforeend', techHTML(t));
    }
    const predOf = s => { const sl = slideOf(s); return (sl && sl.p) || null; };
    const isShown = (s, r) => isGraded(s) ? r.solved : !!r.revealed;
    function revealHTML(s, r) {
      const sl = slideOf(s), P = sl.p, g = r.guess, hit = g === P.a;
      const head = g < 0 ? 'Here’s what happens' : hit ? 'Your guess held' : 'Not what happened';
      const lead = g < 0 || hit ? '' : `It’s <b>${P.o[P.a]}</b>. `;
      return `<div class="reveal"><div class="pverdict ${g < 0 ? 'ns' : hit ? 'hit' : 'miss'}"><span class="pvl">${head}</span><p>${lead}${P.why}</p></div>`
        + `<div class="bigidea"><span class="bil">Big idea</span><p>${sl[0]}</p></div>`
        + (sl[2] && sl[2].length ? `<ul class="tk">${sl[2].map(t => `<li>${t}</li>`).join('')}</ul>` : '') + '</div>';
    }
    function showReveal() {
      const s = screens[i], r = rec[i]; if (!predOf(s) || ctx.$('.reveal')) return;
      const sec = ctx.$('.scr'), m = sec && sec.querySelector('details.more'); const h = revealHTML(s, r);
      if (m) m.insertAdjacentHTML('beforebegin', h); else if (sec) sec.insertAdjacentHTML('beforeend', h);
      placeTech();
      const el = ctx.$('.reveal'); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
    }
    const ctx = { state, L: LG ? LG.state : {}, $: s => main.querySelector(s), $$: s => [...main.querySelectorAll(s)], redraw: () => draw(), esc,
      refresh: () => { const v = main.querySelector('#vis'); if (v) v.innerHTML = visHTML(screens[i]); draw(); },
      score: () => { const g = rec.filter((_, k) => isGraded(screens[k])); return { first: g.filter(r => r.first).length, total: g.length }; },
      records: () => screens.map((s, k) => ({ s, r: rec[k], graded: isGraded(s) })),
      post };
    // the module's own interactive engine (legacy steps), restyled by CSS
    const lctx = LG ? { S: LG.state, H: AIModule.H, $: s => main.querySelector(s), $$: s => [...main.querySelectorAll(s)], update: () => { const st = curStep(); if (st && st.update) st.update(lctx); }, rerender: () => { const v = main.querySelector('#legacy'); const st = curStep(); if (v && st) { v.innerHTML = st.html(lctx); if (st.update) st.update(lctx); } }, post: () => {} } : null;
    const stepById = id => LG && LG.steps.find(s => s.id === id);
    const curStep = () => screens[i] && screens[i].step ? stepById(screens[i].step) : null;

    function visHTML(s) {
      const r = rec[i];
      if (s.type === 'try') { const st = stepById(s.step); if (!st) return '<p>Missing interactive step.</p>'; if (st.enter) st.enter(lctx); return `<div class="legacy${s.keepIntro ? '' : ' nointro'}" id="legacy">${st.html(lctx)}</div>`; }
      if (s.type === 'order') return orderHTML(s, r);
      if (s.type === 'match') return matchHTML(s, r);
      if (s.type === 'sort') return sortHTML(s, r);
      if (s.type === 'pick') return pickHTML(s, r);
      return s.vis ? s.vis(ctx) : '';
    }
    function draw() { const s = screens[i]; if (s.draw) s.draw(ctx); if (s.type === 'try') { const st = stepById(s.step); if (st && st.update) st.update(lctx); if (s.hide) main.querySelectorAll(s.hide.split(',').map(x => '#legacy ' + x.trim()).join(',')).forEach(el => { el.style.display = 'none'; }); } }
    function setBar(kind, title, body) {
      bar.className = 'lp-bar' + (kind ? ' ' + kind : '');
      fb.innerHTML = kind ? `<h3><span class="lp-badge">${kind === 'ok' ? '✓' : '!'}</span>${title}</h3>${body ? `<p>${body}</p>` : ''}` : '';
    }
    const cleanWhy = t => String(t || '').replace(/^\s*(Right|Exactly|Correct|Yes|Yep|Spot on|That’s right|That's right|Good|Nice|True)\b[.!:,;—–-]*\s*/i, '');
    function keysHTML(s) { return s.keys.map(q => { const a = q.options ? q.options[q.answer] : ''; return `<div class="gtk"><span class="kil">Good to know</span><p class="gq">${val(q.title, ctx)}</p><p><b>${a}.</b> ${cleanWhy(val(q.ok, ctx))}</p></div>`; }).join(''); }
    function render() {
      if (LG && LG.state && LG.state._leave) LG.state._leave();
      const s = screens[i], r = rec[i];
      if (s.enter && !r.entered) { r.entered = true; s.enter(ctx); }

    const isHook = (s, k) => s.type === 'choice' && !s.once && (s.eyebrow === 'Think about it' || s.hook || k === 0);
    let hookUsed = false; const kept = [], converted = [];
    body.forEach((s, k) => {
      if (s.type !== 'choice' || s.once || s.keep) { kept.push(s); return; }
      if (!hookUsed && isHook(s, k)) { hookUsed = true; kept.push(s); return; }
      const prev = kept[kept.length - 1];
      if (prev) (prev.keys = prev.keys || []).push(s);
      if (s.chapter) { const nx = body[k + 1]; if (nx && !nx.chapter) nx.chapter = s.chapter; }
      converted.push(s);
    });
    // "In plain words": a simple explanation card at the start of every chapter (after an opening prediction question, if any).
    const P = typeof PLAIN !== 'undefined' && PLAIN[L.id];
    if (P) {
      const withCards = [];
      kept.forEach((s, k) => {
        const card = ch => ({ type: 'concept', eyebrow: 'In plain words', title: ch, plain: true,
          vis: () => `<div class="plain"><div><span class="pl-i">💡</span><div><em>The idea</em><p>${P[ch][0]}</p></div></div><div><span class="pl-i">🔁</span><div><em>Think of it like</em><p>${P[ch][1]}</p></div></div><div><span class="pl-i">🎯</span><div><em>Why it matters to you</em><p>${P[ch][2]}</p></div></div></div>` });
        if (s.chapter && P[s.chapter]) {
          if (s.type === 'choice') { withCards.push(s, card(s.chapter)); return; }
          const c = card(s.chapter); c.chapter = s.chapter; delete s.chapter; withCards.push(c, s); return;
        }
        withCards.push(s);
      });
      kept.length = 0; kept.push(...withCards);
      Object.keys(P).forEach(ch => { if (!withCards.some(x => x.plain && x.title === ch)) console.error('plain: no chapter', ch); });
    }
    out.push(...kept);
    let picks = (C.checks || []).map(t => converted.find(c => c.title === t)).filter(Boolean);
    if (!picks.length && converted.length) { const a = converted[Math.floor(converted.length / 3)], b = converted[Math.floor(converted.length * 2 / 3)]; picks = a === b ? [a] : [a, b]; }
    picks.slice(0, 2).forEach((q, k) => out.push(Object.assign({}, q, { chapter: k ? undefined : 'Check your understanding', eyebrow: 'Check your understanding', keys: undefined, def: undefined })));
    if (last && last.type === 'recap') out.push(last);
    return out;
  }
  // Shared chart helper: ink outlines, chunky dots.
  function chart(o) {
    const W = 600, Hh = o.h || 340, Lm = o.L || 58, B = 46, T = 14, R = 16;
    const sx = v => Lm + (v - o.x0) / (o.x1 - o.x0) * (W - Lm - R), sy = v => Hh - B - (v - o.y0) / (o.y1 - o.y0) * (Hh - B - T);
    const id = 'c' + Math.random().toString(36).slice(2, 8);
    let s = `<svg viewBox="0 0 ${W} ${Hh}" class="chart" role="img" aria-label="${esc(o.label || '')}"><defs><clipPath id="${id}"><rect x="${Lm}" y="${T - 6}" width="${W - Lm - R}" height="${Hh - B - T + 12}"/></clipPath></defs>`;
    (o.xt || []).forEach(v => { s += `<line x1="${sx(v)}" x2="${sx(v)}" y1="${T}" y2="${Hh - B}" stroke="var(--rule)" stroke-width="1.5"/><text x="${sx(v)}" y="${Hh - B + 18}" text-anchor="middle">${o.fx ? o.fx(v) : v}</text>`; });
    (o.yt || []).forEach(v => { s += `<line x1="${Lm}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--rule)" stroke-width="1.5"/><text x="${Lm - 8}" y="${sy(v) + 4}" text-anchor="end">${o.fy ? o.fy(v) : v}</text>`; });
    if (o.xl) s += `<text x="${(Lm + W - R) / 2}" y="${Hh - 6}" text-anchor="middle" class="axl">${o.xl}</text>`;
    if (o.yl) s += `<text transform="translate(14 ${(T + Hh - B) / 2}) rotate(-90)" text-anchor="middle" class="axl">${o.yl}</text>`;
    s += `<g clip-path="url(#${id})">${o.under ? o.under(sx, sy) : ''}`;
    (o.pts || []).forEach(p => { s += `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="${p.r || 7}" fill="${p.c || 'var(--c3)'}" stroke="var(--ink)" stroke-width="2"${p.op ? ` opacity="${p.op}"` : ''}/>`; });
    s += `${o.over ? o.over(sx, sy) : ''}</g></svg>`;
    return s;
  }
  // Small building blocks for concept screens.
  const ui = {
    num: (label, value, cls = '', note = '') => `<div class="num ${cls}"><span>${label}</span><b>${value}</b>${note ? `<small>${note}</small>` : ''}</div>`,
    seg: (name, labels, cur) => `<div class="seg">${labels.map((l, k) => `<button type="button" data-${name}="${k}" aria-pressed="${cur === k}">${l}</button>`).join('')}</div>`,
    recap: items => `<div class="recap">${items.map(([t, d], k) => `<div><i style="background:${['var(--c4)', 'var(--c2)', 'var(--c5)', 'var(--c3)', 'var(--c1)'][k % 5]}">${k + 1}</i><p style="margin:0"><b>${t}</b><span>${d}</span></p></div>`).join('')}</div>`,
    terms: pairs => `<div class="terms2">${pairs.map(([t, d]) => `<div><b>${t}</b><span>${d}</span></div>`).join('')}</div>`,
    big: (text, sub = '') => `<div class="bigidea"><b>${text}</b>${sub ? `<span>${sub}</span>` : ''}</div>`,
    myth: (m, f) => `<div class="myth2"><p><span class="m">Myth</span>${m}</p><p><span class="f">Reality</span>${f}</p></div>`
  };
  return { create, chart, esc, ui, shuffle };
})();

<script>/* Shared shell for every module in the course: navigation, quick checks, key ideas,
   summary, tooltip and messages to an embedding page. Each module calls AIModule.create(config). */
const AIModule = (() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const reg = {};

  function chipInner(t) {
    if (t.unk) return '[UNK]';
    if (t.partial) return esc(t.text);
    let txt = String(t.text), out = '';
    if (txt.startsWith('##')) { out = '<span class="mark">##</span>'; txt = txt.slice(2); }
    for (const ch of txt) {
      if (ch === ' ') out += '<span class="ws">␣</span>';
      else if (ch === '\n') out += '<span class="ws">↵</span>';
      else if (ch === '▁') out += '<span class="mark">▁</span>';
      else out += esc(ch);

    return out;
  }

  const H = {
    esc,
    fmt: n => Number(n).toLocaleString('en-US'),
    pct: (x, d = 0) => (x * 100).toFixed(d) + '%',
    card: (inner, cls = '') => `<div class="card ${cls}">${inner}</div>`,
    objectives: list => `<div class="card"><h3>By the end you will be able to</h3><ol>${list.map(x => `<li>${x}</li>`).join('')}</ol></div>`,
    terms: (pairs, title) => `<div class="card">${title ? `<h3>${esc(title)}</h3>` : ''}<dl class="terms">${pairs.map(([t, d]) => `<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join('')}</dl></div>`,
    pros: (plus, minus, labels = ['Strengths', 'Weaknesses']) =>
      `<div class="card pc"><div class="plus"><h3>${labels[0]}</h3><ul>${plus.map(x => `<li>${x}</li>`).join('')}</ul></div><div class="minus"><h3>${labels[1]}</h3><ul>${minus.map(x => `<li>${x}</li>`).join('')}</ul></div></div>`,
    bars: (rows, opts = {}) => {

    },
    chips: (id, toks, cls = '') => {

    idChips: toks => `<div class="chips">${toks.map((t, i) => `<span class="chip c${i % 6}">${t.id}</span>`).join('')}</div>`,
    choices: (name, items, selected) => `<div class="chooser">${items.map((it, i) => `<button type="button" class="choice" data-${name}="${i}" aria-pressed="${i === selected}">${esc(it)}</button>`).join('')}</div>`,
    viz: {
      flow: (nodes, o = {}) => `<figure class="viz"><div class="flowd">${nodes.map((n, i) => `${i ? '<span class="fa" aria-hidden="true">→</span>' : ''}<div class="fn${n.hl ? ' hl' : ''}">${o.nums === false ? '' : `<span class="fnum">${i + 1}</span>`}<b>${n.t}</b>${n.d ? `<span>${n.d}</span>` : ''}</div>`).join('')}</div>${o.loop ? `<div class="loopback" aria-hidden="true">↺ ${o.loop === true ? 'and repeat' : o.loop}</div>` : ''}${o.cap ? `<figcaption>${o.cap}</figcaption>` : ''}</figure>`,
      compare: (cols, o = {}) => `<figure class="viz"><div class="cmp" style="--n:${cols.length}">${cols.map(c => `<div class="cmpc ${c.tone || ''}"><b>${c.h}</b>${c.sub ? `<span class="cmps">${c.sub}</span>` : ''}${c.items ? `<ul>${c.items.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}</div>`).join(o.vs ? '<span class="cmpvs" aria-hidden="true">vs</span>' : '')}</div>${o.cap ? `<figcaption>${o.cap}</figcaption>` : ''}</figure>`,
      nest: (levels, o = {}) => `<figure class="viz">${levels.reduceRight((inner, l, i) => `<div class="nest" style="--d:${i}"><b>${l.t}</b>${l.d ? `<span>${l.d}</span>` : ''}${inner}</div>`, '')}${o.cap ? `<figcaption>${o.cap}</figcaption>` : ''}</figure>`,
      stack: (blocks, o = {}) => {
        let html = '', grp = [];

        const flush = () => { if (grp.length) { html += `<div class="stkrep"><span class="stkrl">${o.rep || 'repeated many times'}</span>${grp.map(blk).join('')}</div>`; grp = []; } };

    },
    analogy: (title, text) => `<div class="analogy"><b>${title}</b>${text}</div>`,
    myths: list => `<div class="myths">${list.map(([m, f]) => `<div class="myth"><p><span class="m">Myth:</span> ${m}</p><p><span class="f">Reality:</span> ${f}</p></div>`).join('')}</div>`,
    vocab: pairs => `<dl class="terms">${pairs.map(([t, d]) => `<dt>${esc(t)}</dt><dd>${d}</dd>`).join('')}</dl>`,
    basics: o => `<p class="kicker">The basics</p><h2>${o.title}</h2><p class="lede">${o.one}</p>
      <section class="learn" aria-label="Learn"><p class="learn-tag">Learn</p>${o.plain.map(p => p.startsWith('<') ? p : `<p>${p}</p>`).join('')}${o.viz || ''}</section>
      ${o.analogy ? `<div class="analogy"><b>${o.analogy[0]}</b>${o.analogy[1]}</div>` : ''}
      ${o.vocab ? `<div class="card"><h3>Words to know</h3><dl class="terms">${o.vocab.map(([t, d]) => `<dt>${esc(t)}</dt><dd>${d}</dd>`).join('')}</dl></div>` : ''}
      ${o.where ? `<div class="card"><h3>Where you already meet it</h3><ul class="plain">${o.where.map(w => `<li>${w}</li>`).join('')}</ul></div>` : ''}
      ${o.myths ? `<div class="card"><h3>Common misunderstandings</h3><div class="myths">${o.myths.map(([m, f]) => `<div class="myth"><p><span class="m">Myth:</span> ${m}</p><p><span class="f">Reality:</span> ${f}</p></div>`).join('')}</div></div>` : ''}
      ${o.fits ? `<div class="card"><h3>How this fits in the course</h3><p>${o.fits}</p></div>` : ''}`,
    setPressed: (name, i) => $$(`[data-${name}]`).forEach(b => b.setAttribute('aria-pressed', String(+b.getAttribute('data-' + name) === i))),
    softmax: (xs, temp = 1) => { const m = Math.max(...xs.map(x => x / temp)); const e = xs.map(x => Math.exp(x / temp - m)); const s = e.reduce((a, b) => a + b, 0); return e.map(x => x / s); },
    hash: s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h; }
  };

  // Learn content (from a module's learn.js) is added before each step's interactive part.
  function withLearn(s, L) {
    const learn = typeof L === 'string' ? L : L.html;
    const block = `<section class="learn" aria-label="Learn"><p class="learn-tag">Learn</p>${learn}</section>${L.noTry ? '' : '<p class="try-tag">Try it</p>'}`;
    return { ...s, html: ctx => {

  }
  function create(cfg) {
    const S = cfg.state || {};
    const checks = Object.assign({}, cfg.checks || {});
    const L = cfg.learn || (typeof LEARN !== 'undefined' ? LEARN : null);
    const V = cfg.visuals || (typeof VISUALS !== 'undefined' ? VISUALS : null);
    if (V && L) {
      if (V.basics && L.basics) L.basics.viz = V.basics;
      L.steps = L.steps || {};
      Object.entries(V.steps || {}).forEach(([id, html]) => {
        const cur = L.steps[id];
        L.steps[id] = cur === undefined ? html : typeof cur === 'string' ? cur + html : { ...cur, html: cur.html + html };
      });
    }
    let base = cfg.steps.slice();
    if (L) {
      base = base.map(s => L.steps && L.steps[s.id] ? withLearn(s, L.steps[s.id]) : s);
      if (L.basics) {
        base.splice(1, 0, { id: 'basics', label: L.basics.label || 'The basics', html: () => H.basics(L.basics), keyIdea: L.basics.keyIdea });

      }
      if (L.glossary) {

        cfg.glossary = [...cfg.glossary, ...L.glossary.filter(([t]) => !have.has(t.toLowerCase()))];
      }
    }
    if (V && V.activities && V.activities.length) base.push(yourTurnStep(V));
    const order = base.map(s => s.id);
    const sorted = {}; order.forEach(id => { if (checks[id]) sorted[id] = checks[id]; }); Object.keys(checks).forEach(id => { if (!sorted[id]) sorted[id] = checks[id]; });
    Object.keys(checks).forEach(k => delete checks[k]); Object.assign(checks, sorted);
    const steps = cfg.noSummary ? base : [...base, summaryStep()];
    const nav = { step: 0, visited: new Set([0]), answers: new Map(), completed: false };
    const stage = $('#stage');
    const post = msg => { try { if (window.parent !== window) window.parent.postMessage({ source: 'ai-module', module: cfg.id, ...msg }, '*'); } catch (e) {} };
    const ctx = { S, H, $, $$, update: () => { const s = steps[nav.step]; if (s.update) s.update(ctx); }, rerender: () => renderStep(), post };

    // ---------- Your turn: learn-by-doing activities ----------
    const AC = [];
    const shuf = (n, key) => { const idx = [...Array(n).keys()]; let h = 2166136261; for (const ch of cfg.id + ':' + key) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } for (let i = n - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 13), 1103515245) + 12345 | 0; const j = (h >>> 0) % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; } if (n > 1 && idx.every((v, i) => v === i)) idx.push(idx.shift()); return idx; };
    const TYPE_LABEL = { sequence: 'Put in order', match: 'Match', sort: 'Sort', pick: 'Click the word' };
    function activityHTML(a, i) {
      const st = AC[i] || (AC[i] = { placed: [], sel: {}, pick: {}, checked: false });
      let body = '';
      if (a.type === 'sequence') {
        const pool = shuf(a.items.length, 'seq' + i).filter(k => !st.placed.includes(k));

        body = `<div class="seq"><div><p class="small"><b>Steps to place</b> (click one to add it next):</p><div class="seqpool">${pool.map(k => `<button type="button" class="wbtn" data-acx="${i}" data-op="place" data-v="${k}">${a.items[k]}</button>`).join('') || '<span class="small">All placed.</span>'}</div></div>
          <div><p class="small"><b>Your order</b> (click a step to take it back):</p><ol class="seqlist">${st.placed.map((k, p) => `<li><button type="button" class="seqitem${st.checked ? (k === p ? ' right' : ' wrong') : ''}" data-acx="${i}" data-op="unplace" data-v="${k}" ${st.checked ? 'disabled' : ''}>${a.items[k]}</button></li>`).join('')}</ol></div></div>
          <div class="btns"><button type="button" class="btn primary" data-acx="${i}" data-op="check" ${st.placed.length < a.items.length || st.checked ? 'disabled' : ''}>Check my order</button><button type="button" class="btn" data-acx="${i}" data-op="reset">Start again</button></div>
          ${st.checked ? `<p class="fb"><b>${ok === a.items.length ? 'All in the right order.' : `${ok} of ${a.items.length} in the right place.`}</b> ${ok === a.items.length ? (a.why || '') : `The right order: ${a.items.map((t, k) => `${k + 1}. ${t}`).join(' · ')}. ${a.why || ''}`}</p>` : ''}`;
      } else if (a.type === 'match') {
        const rights = shuf(a.pairs.length, 'match' + i);
        const ok = a.pairs.filter((_, k) => st.sel[k] === k).length;
        body = `<div class="matchg">${a.pairs.map(([l], k) => `<div class="matchr${st.checked ? (st.sel[k] === k ? ' right' : ' wrong') : ''}"><span>${l}</span><select data-acx="${i}" data-k="${k}" aria-label="Match for ${esc(String(l).replace(/<[^>]+>/g, ''))}" ${st.checked ? 'disabled' : ''}><option value="">Choose…</option>${rights.map(r => `<option value="${r}" ${st.sel[k] === r ? 'selected' : ''}>${esc(String(a.pairs[r][1]).replace(/<[^>]+>/g, ''))}</option>`).join('')}</select>${st.checked && st.sel[k] !== k ? `<span class="small">Right match: ${a.pairs[k][1]}</span>` : ''}</div>`).join('')}</div>
          <div class="btns"><button type="button" class="btn primary" data-acx="${i}" data-op="check" ${st.checked ? 'disabled' : ''}>Check my matches</button><button type="button" class="btn" data-acx="${i}" data-op="reset">Start again</button></div>
          ${st.checked ? `<p class="fb"><b>${ok} of ${a.pairs.length} matched correctly.</b> ${a.why || ''}</p>` : ''}`;
      } else if (a.type === 'sort') {
        body = `<div style="display:grid;gap:8px">${a.items.map(([t, b, why], k) => { const p = st.pick[k]; return `<div class="scen"><p style="margin:0"><b>${t}</b></p><div class="btns">${a.buckets.map((bk, v) => `<button type="button" class="opt${p !== undefined ? (v === b ? ' right' : p === v ? ' wrong' : '') : ''}" data-acx="${i}" data-op="sort" data-k="${k}" data-v="${v}" ${p !== undefined ? 'disabled' : ''}>${bk}</button>`).join('')}</div>${p !== undefined && why ? `<p class="small" style="margin:0">${why}</p>` : ''}</div>`; }).join('')}</div>
          ${Object.keys(st.pick).length === a.items.length ? `<p class="fb"><b>${a.items.filter(([, b], k) => st.pick[k] === b).length} of ${a.items.length} right.</b> ${a.why || ''} <button type="button" class="btn" data-acx="${i}" data-op="reset">Try again</button></p>` : ''}`;
      } else if (a.type === 'pick') {
        body = `<div style="display:grid;gap:10px">${a.items.map((it, k) => { const words = it.s.split(' '), p = st.pick[k]; return `<div class="scen"><p class="small" style="margin:0">${it.q}</p><div class="words">${words.map((w, wi) => `<button type="button" class="wbtn${p !== undefined ? (wi === it.a ? ' right' : wi === p ? ' wrong' : '') : ''}" data-acx="${i}" data-op="pick" data-k="${k}" data-v="${wi}" ${p !== undefined ? 'disabled' : ''}>${esc(w)}</button>`).join('')}</div>${p !== undefined ? `<p class="small" style="margin:0"><b>${p === it.a ? 'Right.' : 'Not quite.'}</b> ${it.why || ''}</p>` : ''}</div>`; }).join('')}</div>

        const lines = split ? [0, 1, 2].map(g => fitLine(C.filter(c => c.g === g), PAL[g], 3)) : [fitLine(C, 'var(--accent)', 3)];
        $('#corChart').innerHTML = plot({ id: 'corSvg', x0: 0, x1: 22, y0: 0, y1: 85, xt: [0, 5, 10, 15, 20], yt: [0, 20, 40, 60, 80], fy: v => '$' + v + 'k', xl: 'Rep visits last year', yl: 'Annual spend', label: 'Rep visits against spend',

        const r = ST.corr(C.map(c => c.x), C.map(c => c.y)), rg = [0, 1, 2].map(g => { const k = C.filter(c => c.g === g); return ST.corr(k.map(c => c.x), k.map(c => c.y)); });

          : `<p><b>Correlation: ${r.toFixed(2)}</b>, a strong positive link (1 would be perfect, 0 none). It is tempting to conclude “double the visits, double the spend”. Split by clinic size before deciding.</p>`;
      } },

    { id: 'abtest', label: 'A/B tests',

            draw: linDraw(S.lm, S.lb, pts), pts: pts.map(p => ({ x: p.x, y: p.y, c: p.out ? 'var(--bad)' : 'var(--ink)', r: p.out ? 7 : 5 })),
            top: (sx, sy) => `<circle cx="${sx(S.lq)}" cy="${sy(S.lm * S.lq + S.lb)}" r="7" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>` });
          $('#numTxt').innerHTML = `<div class="stats">${big('Your line misses by', (miss(S.lm, S.lb)).toFixed(1) + ' cases', 'on average')}${big('Best possible line', miss(best.m, best.b).toFixed(1) + ' cases', 'least squared error')}${big(`Prediction for ${S.lq} beds`, Math.round(S.lm * S.lq + S.lb) + ' cases', 'from your line')}</div>

              `<path d="${[...Array(241)].map((_, i) => { const x = 0.5 + i * 0.1; return (i ? 'L' : 'M') + sx(x).toFixed(1) + ',' + sy(b.f(x)).toFixed(1); }).join('')}" fill="none" stroke="var(--accent)" stroke-width="3"/>`,

            pts: ST.LATE.map(q => ({ x: q.x + (q.j - 0.5) * 0.5, y: q.y ? 1 - q.j * 0.05 : q.j * 0.05, yes: !q.y, sq: !!q.y, r: 4.5 })),

/* Helpers that turn a module's existing material (checks, diagrams, activities) into lesson screens. */

  }

    'Rules or examples?': ['Normal software follows rules a person wrote. Machine learning works the other way: you show it many examples with the right answers, and it works out the rules itself.', 'Teaching a new colleague by showing them 100 past emails marked “spam” or “fine”, instead of handing them a rulebook.', 'Some jobs are too messy for rules: spotting spam, predicting which customers might leave. Those are the jobs machine learning is good at.'],
    'Predicting from similar cases': ['One simple way to predict: find the past cases most like this one, and see what happened to them.', 'Guessing a house price by looking at the three most similar houses that sold on the same street.', 'Many predictions at work, like which accounts might stop ordering, come down to “customers like this one usually…”.'],
    'Memorising vs learning': ['A model can learn the general pattern, or it can just memorise its examples. Memorising looks perfect on old data and fails on new data.', 'A student who memorised last year’s exam answers, then meets new questions.', 'Always judge a model on data it hasn’t seen. A model that is “100% accurate” on its own training data may be useless.'],
    'Three kinds of learning': ['Machine learning comes in three flavours: learning from labelled answers, finding groups with no labels, and learning by trial and reward.', 'Studying with an answer key, sorting a pile of photos into similar groups, and learning a game by playing it.', 'Knowing which flavour fits tells you what data you need: labelled examples, just raw data, or a way to score attempts.'],

    'Data augmentation': ['Make more training photos by flipping, rotating, zooming or brightening the ones you have.', 'Practising recognising a friend’s face in different lighting and from different angles.', 'It’s a cheap way to make a model sturdier when you only have a few hundred photos.'],
    'Transfer learning': ['Start from a model already trained on millions of everyday photos, and retrain only its last part for your job.', 'Hiring an experienced photographer and teaching them your product range, instead of teaching someone to see from scratch.', 'It means a useful image model can be built from hundreds of your photos, not millions.'],
    'Other network types': ['Different data suits different networks: CNNs for grids like pictures, RNNs for sequences read in order, transformers for reading everything at once.', 'Different vehicles for different trips: a van, a train, a plane.', 'Most new AI, including chatbots, uses transformers. You’ll still meet the others in older or specialised tools.'],
    'Making new images': ['Generative image AI makes new pictures. Older systems pitted a forger against a detective; today’s mostly start from noise and clean it up step by step.', 'A sculptor removing stone until a statue appears, guided by your description.', 'Generated images are great for ideas and backgrounds, but they can look real without being real.'],
    'Image AI at work': ['Image AI is good at narrow, repeated visual checks with clear examples.', 'A tireless inspector who has seen thousands of good and bad examples of one thing.', 'Think of jobs like reading labels, counting boxes or flagging damage, and keep a person checking the edge cases.'] },
  'nlp': {
    'Why language is hard': ['Words change meaning with context, tone and small words like “not”. Computers have to learn all of that.', 'A friend saying “great, just great” after missing the bus. The words are positive; the meaning isn’t.', 'This is why simple keyword tools misread customers, and why checking AI’s reading of messages matters.'],
    'Everyday jobs': ['Most language AI at work does a few jobs: sort messages, pull out details, read the tone, summarise, translate and write.', 'A helpful assistant who sorts the post, highlights the key numbers and drafts replies.', 'Naming the job tells you what to check: the category, the extracted numbers, or the facts in a summary.'],
    'Words into numbers': ['Computers only work with numbers, so text has to be turned into numbers first. The simplest way counts words and ignores their order.', 'Describing a recipe only by its ingredient list. Useful, but you lose the steps.', 'It explains why old tools missed “don’t cancel”: counting words loses how they connect.'],
    'Rules to language models': ['Language AI moved from hand-written rules, to models learned from examples, to large language models that read whole messages in context.', 'From a phrasebook, to learning from conversations, to living in the country.', 'Each step handles more variety, but all of them still need your definitions of what counts as, say, a complaint.'],
    'Measuring it': ['To judge a language system, count what it catches and what it gets wrong. A threshold trades missed cases against false alarms.', 'A security guard who stops everyone causes queues; one who stops no one misses thieves.', 'Decide which mistake costs more for your process, then set the system up and measure it on real messages.'],
    'Which job fits?': ['Match each task to the language job it really is, then choose the tool.', 'Knowing whether you need a translator, an editor or a filing clerk.', 'Getting this right is half the work of using language AI well.'] },
  'tokenization': {
    'What a model reads': ['A language model doesn’t see letters or words directly. Text is cut into pieces called tokens, and each token is swapped for a number.', 'A cloakroom: your coat is swapped for a numbered ticket, and staff work with the tickets.', 'Tokens explain model limits, costs and some odd mistakes, such as miscounting letters.'],
    'Three ways to cut text': ['You can cut text into single letters, whole words, or something in between. Modern models use the in-between: subwords.', 'Lego: single studs are too small, whole pre-built models too rigid, standard bricks just right.', 'Subwords let a model handle new words, names and product codes by building them from known pieces.'],
    'How a tokenizer learns': ['A tokenizer learns its pieces from lots of text by repeatedly gluing together the most common pairs.', 'Noticing that “th” and “ing” appear everywhere, so you give them their own keys on a keyboard.', 'Common words become one token; rare words and codes split into several, which affects cost and accuracy.'],
    'Why it matters': ['Tokens decide what a model can fit, what it costs, and why some languages and codes use more of them.', 'Paying for a taxi by distance: some routes cost more for the same destination.', 'Long documents, non-English text and part numbers can use far more tokens than you’d expect.'] },
  'embeddings': {
    'Meaning as numbers': ['An embedding gives each word or text a list of numbers, like an address, so that similar meanings get similar numbers.', 'Describing coffees by scores for strength, sweetness and acidity: similar coffees get similar scores.', 'This is what lets AI search by meaning, group similar tickets and find related products.'],
    'The meaning map': ['Put those addresses on a map and words with similar meanings sit close together. Closeness can be measured as a score.', 'A supermarket layout where related items share an aisle.', 'Similarity scores are behind “related articles”, duplicate detection and meaning-based search.'],
    'Learned from text': ['Nobody types the numbers in. They are learned from text: words used in similar sentences end up close together.', 'Guessing what an unknown word means from the sentences around it.', 'Embeddings reflect whatever text they learned from, including its blind spots and biases.'],
    'One word, many meanings': ['Modern models give the same word different numbers in different sentences, based on the words around it.', '“Case” in a warehouse and “case” in a courtroom: you know which from the sentence.', 'That’s how AI tells apart product terms that have everyday meanings, like “case”, “order” or “return”.'],
    'Embeddings at work': ['Embeddings power search by meaning, but exact codes still need keyword search, and many tools combine both.', 'Asking a librarian for “books like this one” versus looking up an exact catalogue number.', 'If an AI search can’t find part NG-4471-M, the fix may be keyword search, not a better model.'] },
  'attention': {
    'Words need context': ['To understand a word, you often have to look back at other words. Attention is how a model does that.', 'Reading “it” in a sentence and glancing back to see what “it” refers to.', 'Attention is the core idea behind every modern chatbot. It’s how they keep track of who did what.'],
    'How attention works': ['Each word scores how relevant every other word is, turns the scores into shares that add up to 100%, and blends in information by share.', 'In a meeting, you listen most to the people talking about your topic, and only a little to everyone else.', 'This is how a model links “it” to the right noun, or a figure to the right product, across a long message.'],
    'Heads, layers and transformers': ['A model runs many attention “heads” side by side, each looking for different links, and repeats this over many layers.', 'Several readers each highlighting a different thing, such as names, dates and numbers, then passing the page on.', 'Many heads and layers are why models can track grammar, facts and tone at once.'],
    'Why long texts are hard': ['Every word looks at every other word, so doubling the text roughly quadruples the work.', 'A party where everyone shakes everyone’s hand: twice the guests means about four times the handshakes.', 'This is why long inputs cost more, run slower and have limits.'] },
  'transformer': {
    'Word order': ['Attention alone doesn’t know which word came first, so models add position information to every word.', 'Numbering the pages of a book so the chapters can’t be shuffled.', 'Without it, “the client paid us” and “we paid the client” would look the same.'],
    'Residual connections': ['Each layer adds its improvement to what the word already had, instead of replacing it.', 'Editing a document with tracked changes: the original stays, the edits build on top.', 'This is what lets models stack dozens of layers without losing the original meaning.'],
    'The feed-forward layer': ['After attention, each word is processed on its own by a small network that adds stored knowledge.', 'After a team meeting, everyone goes back to their desk and uses their own expertise.', 'Much of what a model “knows”, like facts and associations, lives in these layers.'],
    'The full block': ['A transformer block is attention, then the feed-forward layer, each with a tidy-up step (layer norm) and a residual connection. Models stack many blocks.', 'One floor of a building, repeated floor after floor.', 'When people say a model has “96 layers”, they mean it stacks 96 of these blocks.'],
    'From numbers to words': ['At the end of the stack, the model scores every token it knows, turns the scores into chances, picks one, and repeats.', 'A predictive keyboard that suggests the next word, again and again.', 'Every reply you read was produced this way, one token at a time.'],
    'The whole model': ['A chat model is one tall stack: text in at the bottom, blocks in the middle, one next token out at the top, then round again.', 'A production line: raw material in, the same stations repeated, one finished part out, and the part goes back in for the next round.', 'You can read almost any diagram of a chat model once you know these dozen boxes.'],
    'Three model families': ['Some transformers only read (encoders), some only write (decoders), and some read then write (encoder-decoders).', 'A reviewer, an author, and a translator who reads then writes.', 'It explains why search tools, chatbots and translation tools are built differently.'] },
  'generation': {
    'Predict, pick, repeat': ['A language model writes by predicting the next token, picking one, adding it, and repeating.', 'Autocomplete on your phone, pressed over and over.', 'Replies come from likely next words, not from looking up facts. That explains both its fluency and its mistakes.'],
    'How it picks': ['Settings like temperature control whether the model always takes the most likely word or sometimes picks a less likely one.', 'A cautious chef following the recipe versus an adventurous one trying new spices.', 'Use low settings for facts and figures, higher ones for brainstorming.'],
    'Running a model': ['Every reply costs time and money: the model reads your input, then writes its output one token at a time.', 'A taxi that charges for the distance you give it and, more, for the distance it drives.', 'Shorter replies are faster and cheaper; long chats don’t mean the model remembers you next time.'],
    'Fluent but wrong': ['Because it writes likely text, a model can produce confident, polished sentences that are false.', 'A smooth talker who never says “I don’t know”.', 'Always check names, numbers, dates and citations before anything goes to a customer.'],
    'Using it well': ['Match the setting to the task: precise for facts, creative for ideas.', 'Using a pen for contracts and a whiteboard for brainstorming.', 'A small change in how you ask often matters more than which model you use.'] },
  'training': {
    'Learning is adjusting': ['Training means adjusting a model’s numbers again and again so its predictions get less wrong.', 'Tuning a guitar: pluck, listen, turn the peg a little, repeat.', 'Everything a model can do was set during training, which is why its knowledge has a cut-off date.'],
    'Stage 1: Pretraining': ['First, the model reads huge amounts of text and practises predicting the next word.', 'Reading a whole library before starting a job.', 'Pretraining gives broad knowledge, but not manners, focus or your company’s facts.'],
    'Stage 2: Supervised fine-tuning': ['Next, it learns from examples of instructions paired with good answers.', 'Shadowing an experienced colleague and copying how they respond.', 'This is what turns a text predictor into an assistant that follows instructions.'],
    'Stage 3: Alignment': ['Finally, it learns from people’s preferences about which answers are better: helpful, honest and harmless.', 'Customer feedback ratings shaping how a new rep handles calls.', 'Preference training can also teach bad habits, like agreeing with you too readily.'],
    'Why it matters': ['Training sets what a model knows and how it behaves. It doesn’t learn from your chat as you talk.', 'A printed handbook: useful, but it won’t update itself mid-meeting.', 'Give it current facts yourself, and don’t assume it remembers past conversations.'] },
  'reasoning': {
    'Thinking out loud': ['Reasoning models write out their working before answering, which helps on problems with many steps.', 'Doing long division on paper instead of in your head.', 'Use them for calculations, planning and tricky rules, and check the working.'],
    'More thinking': ['More attempts and longer thinking usually give better answers, but cost more time and money.', 'Asking three colleagues and going with the majority.', 'Save heavy thinking for questions that need it.'],
    'When to use it': ['Simple tasks don’t need thinking mode; multi-step ones do.', 'You don’t need a calculator to add 2 and 2.', 'Matching the mode to the task saves time and money.'],
    'Can you trust the working?': ['Neat working can still contain mistakes, and it may not show everything that shaped the answer.', 'A tidy spreadsheet with one wrong formula.', 'Check the steps and the final number, not just how convincing it looks.'] },
  'using': {
    'Good jobs for AI': ['AI is great at first drafts, summaries and reformatting, and weaker at exact facts and judgement calls.', 'A fast, eager intern who needs clear briefs and a second pair of eyes.', 'Use it to get started quickly, and keep the decisions and final checks for yourself.'],
    'Write a good brief': ['The more context you give, the better the draft: goal, audience, tone, what to include, format, and an example.', 'Briefing a designer: “make a flyer” gets something; a clear brief gets what you want.', 'A two-minute brief can save twenty minutes of rewriting.'],
    'Check before you use it': ['Compare AI output with its source: names, numbers, dates, promises and anything missing.', 'Proofreading a contract before signing.', 'You are responsible for what you send, whoever drafted it.'],
    'AI with your data': ['AI can write database queries and pull fields out of documents, but the output can be valid and still wrong.', 'A well-formatted invoice with the wrong total.', 'Take figures from your system of record, and check the logic behind any AI-written query.'],
    'Reusable prompts': ['Save prompts that work as templates with blanks, so the whole team gets consistent results.', 'A form letter with the name and date left blank.', 'Templates turn one good prompt into a repeatable process.'] },
  'improving': {
    'Closing the gap': ['A model doesn’t know your company’s information unless you give it, and there are several ways to do that.', 'A brilliant new hire who hasn’t read your handbook yet.', 'Picking the right way, prompt, documents, training or tools, decides cost and accuracy.'],
    'Better prompts': ['The cheapest fix is a better prompt: give context, the task, an example and the format you want.', 'Giving clear directions instead of “take me somewhere nice”.', 'Always try this first before paying for anything bigger.'],
    'RAG and CAG': ['RAG looks up the most relevant passages for each question and gives them to the model. CAG loads a small set of documents once and reuses them.', 'An open-book exam where you fetch the right page, versus keeping a short cheat sheet on the desk.', 'This is how company assistants answer from your policies instead of guessing.'],
    'Fine-tuning and tools': ['Fine-tuning retrains a model for a consistent style or format. Tools let it call a calculator, a search or your systems.', 'Training someone in your house style, versus handing them a calculator and system access.', 'Use fine-tuning for style at volume, and tools for live data and exact maths.'],
    'Choosing a method': ['Match the method to the need: prompts first, RAG for big or changing knowledge, CAG for small stable sets, fine-tuning for style, tools for live data.', 'Choosing between a note, a library, a cheat sheet, a training course and a phone line.', 'The right choice keeps costs down and answers grounded.'],
    'Building an AI app': ['A real AI tool wraps the model in steps: find information, build the prompt, call the model, check the answer, and log it.', 'A restaurant: the chef is the model, but ordering, prep, plating and quality checks make the meal.', 'Most problems in AI apps come from the steps around the model, not the model itself.'] },
  'agents': {
    'From answering to acting': ['A chatbot answers questions. An agent takes actions: it looks things up, uses tools and completes tasks.', 'Asking for directions versus asking someone to drive you there.', 'Agents can save real time, and they can also make real mistakes in real systems.'],
    'How a model uses tools': ['The model can only write text. To use a tool, it writes a request, and the app around it checks and runs it.', 'A manager who writes instructions for an assistant, who checks they’re allowed and then does the task.', 'Because the app runs every tool, the tools you connect, and their permissions, are your main safety control.'],
    'The agent loop': ['An agent repeats a loop: look at the situation, decide, act, check the result, and go again until it’s done.', 'Cooking without a recipe: taste, adjust, taste again.', 'Good agents stop and ask a person when they’re unsure.'],
    'Workflow or agent?': ['A workflow follows steps written in advance; an agent decides its own steps. Simpler is usually better.', 'A checklist versus a trusted employee using judgement.', 'Use an agent only when the steps depend on what it finds.'],
    'Access and freedom': ['Give agents only the access they need, and decide which actions need a person’s approval.', 'A new temp gets the keys to their own office, not the whole building.', 'Limiting access limits the damage if something goes wrong.'],
    'What can go wrong': ['Small mistakes add up over many steps, and content the agent reads can try to give it orders.', 'Whispered instructions passed down a line of people get garbled.', 'Long tasks need checkpoints, and outside content should never be treated as instructions.'] },
  'choosing': {
    'Do you need an LLM?': ['Language models are for language. Number predictions from tables and fixed rules often need simpler tools.', 'You don’t need a chef to make toast.', 'Choosing the simplest tool that works saves money and gives more reliable results.'],
    'No single best model': ['Models trade off quality, speed, cost and privacy. The best one depends on the job.', 'A delivery van, a motorbike and a lorry are each “best” for different deliveries.', 'Pick by testing on your task, not by reputation.'],
    'Size and openness': ['Bigger models are usually more capable but slower and pricier. Open-weight models can run on your own systems; closed ones are used as a service.', 'Buying a car versus using a taxi service.', 'Size and openness affect cost, privacy, control and the licence terms you must follow.'],
    'Test on your own work': ['Public leaderboards are a start, but only a test on your own examples tells you what works for you.', 'Test-driving a car on your own commute, not just reading the brochure.', 'A small, repeatable test set lets you compare models fairly and catch problems early.'] },
  'responsible': {
    'Check before you trust': ['AI output is fast and fluent, which makes it easy to trust too quickly.', 'A confident stranger giving directions: helpful, but worth a quick check on the map.', 'Check facts, figures and promises before anything leaves your hands.'],
    'Protect data': ['Only put data into approved tools, share the minimum, and watch for hidden instructions in content AI reads.', 'Not reading out a customer’s card number in a crowded lift.', 'One careless paste can expose customer or company information.'],
    'Fairness and rights': ['AI learns from past data, including its unfairness, and other people’s work comes with rights.', 'A hiring habit copied from the past, unfairness included.', 'Check outcomes across groups, and respect the rights of creators and of the people in your data.'],
    'Keep people in charge': ['The higher the stakes, the more a person should review before AI output is used.', 'An autopilot still needs a pilot for take-off and landing.', 'You own the result, whatever tool helped you make it.'],
    'Risks and controls': ['Every AI risk has a matching safeguard: checks, approvals, limits and reviews.', 'Seatbelts, brakes and speed limits each answer a different driving risk.', 'Name the risk first; then the right control is usually obvious.'] }
};
