SLIDES['machine-learning'] = {
  'Software that learns from examples': ['Machine learning means the computer learns the rules from examples, instead of a person writing them.', '', ['Normal software: people write the rules.', 'Machine learning: you give examples with answers, and it finds the rules.', 'The models behind every AI tool in this course, chat assistants included, learned from examples.']],
  'Rule or machine learning?': ['Write rules when you can spell them out. Use machine learning when the pattern is too messy to write down.', 'Sort each task: would you write a rule, or learn it from examples?', ['Exact, stable logic: rules.', 'Fuzzy patterns that keep changing: machine learning.']],
  'Write a spam rule': ['A rule you write yourself works, until the world changes.', 'Pick trigger words so all six of this week’s emails land in the right folder.', ['Writing the rule yourself is regular programming.', 'It fits this week perfectly. Next, see what happens next week.']],
  'Then next week’s emails arrive': ['Rules break when wording changes: every fix helps one email and hurts another.', 'Try to fix your rule for next week’s emails.', ['Spammers change their words; real emails start using your trigger words.', 'No single word list gets both weeks right.']],
  'Teach a filter instead': ['Instead of writing rules, you label examples, and the filter works out which words matter.', 'Label all 12 emails as spam or real, then see how the filter does on next week’s mail.', ['You give answers, not rules.', 'The filter retrains every time you add a label.']],
  'What the filter learned': ['The filter gave every word a weight from your labels. Nobody wrote those rules.', '', ['Words used in both spam and real mail barely count.', 'The pattern came from the examples. That is machine learning.']],
  'Training data and test data': ['Judge a model on examples it has never seen.', '', ['Training data: the examples it learns from.', 'Test data: new examples kept back to measure it honestly.']],
  'Find a customer the model thinks will leave': ['A prediction is an educated guess based on the most similar past cases.', 'Tap the chart to place a new customer and see what the 5 most similar past customers did.', ['Most neighbours left, so the model predicts “will leave”.', 'How many neighbours agree gives a rough sense of how sure it is.']],
  'This method is called k-nearest neighbours': ['k-nearest neighbours: find the k most similar past cases and go with the majority.', '', ['Here, k is 5.', '5 out of 5 agreeing is a safer bet than 3 out of 5.', 'Like pricing a house from similar sales nearby.']],
  'Pick the clues that matter': ['A model can only learn from the details you give it, so pick details that really relate to the outcome.', 'Try each pair of clues and find the one that scores best on new customers.', ['These details are called features.', 'Useful features help; unrelated ones only add noise.']],
  'Always compare with a baseline': ['A score only means something next to a baseline: what you’d get with no model at all.', '', ['A simple baseline: always guess the most common answer.', 'A model that barely beats it isn’t learning much.']],
  'Find the sweet spot': ['Too simple misses the pattern; too complex memorises noise. The best model sits in between.', 'Slide to change how many neighbours it checks. Find the setting that does best on new customers.', ['Watch the score on new customers, not old ones.', 'The best setting for old data is rarely the best for new data.']],
  'Overfitting and underfitting': ['A model that memorises its examples looks perfect on old data and fails on new data.', '', ['Overfitting: it memorises quirks.', 'Underfitting: it’s too simple and misses the pattern.', 'When you hear “99% accurate”, ask: measured on what?']],
  'Same examples, different answers': ['Three learners can follow the same examples and still disagree about a new case.', 'Switch between the three learners and compare what each predicts for a 48-month account.', ['The data only covers the cases you’ve seen.', 'Everything beyond them comes from the learner’s assumptions.']],
  'Every learner makes assumptions': ['Every learner has built-in assumptions, its inductive bias. Without them it couldn’t predict anything new.', '', ['No method is best for every problem.', 'Prefer the simplest explanation that fits the data.', 'Choose assumptions that suit the problem, then test on new data.']],
  'How much data is enough?': ['With little data, simple models win. With plenty, flexible models pull ahead.', 'Slide the amount of training data. Find where the flexible model starts making fewer mistakes.', ['A simple model stalls when it can’t draw the real shape.', 'A flexible model needs more examples before it stops chasing noise.']],
  'Flexible models need more data': ['The more patterns a model could fit, the more examples it needs to pick the right one.', '', ['The data needed also grows with how small an error you want and how sure you need to be.', 'A learning curve on your own data shows whether more data would help.']],
  'Three kinds of machine learning': ['There are three kinds of machine learning, depending on what the examples look like.', '', ['Supervised: examples with answers.', 'Unsupervised: no answers; it finds groups.', 'Reinforcement: it learns from rewards for trying things.']],
  'Segment 84 customer accounts': ['With no labels at all, the computer can still group similar customers. People decide what the groups mean.', 'Read each segment’s profile and give it a name.', ['This is clustering, here with a method called k-means.', 'The computer finds the groups; you decide what they mean and how to use them.']],
  'Learn by trial and reward': ['Reinforcement learning tries options, keeps score of what works, and does more of it.', 'Send at least 200 emails and watch which subject line the system favours.', ['Each click is a reward.', 'It mostly uses the best option, but keeps testing the others a little.']],
  'Catch every customer who leaves': ['Catching more real cases usually means more false alarms. You choose the balance.', 'Set how sure the model must be before it flags someone, so no customer who leaves is missed.', ['Lower the bar: catch more, with more false alarms.', 'Choose based on what each kind of mistake costs.']],
  'A model is only as good as its examples': ['If the examples are wrong, biased, out of date or too few, the model will be too.', '', ['Ask where the examples came from.', 'Check they look like the situations you’ll use the model on.']],
  'Run a machine learning project': ['A project runs from question, to data, to training, to testing, to watching it after launch.', 'Put the project steps in order.', ['Test on unseen examples before anyone relies on it.', 'Keep monitoring: the world changes.']]
};
SLIDES['neural-networks'] = {
  'AI built from tiny calculators': ['A neural network is many tiny calculators, called neurons, connected in layers.', '', ['Each neuron does simple arithmetic: it’s maths, not a brain.', 'Millions together can read, listen and write.', 'Not all AI is a neural network: the decision trees in Data and statistics aren’t.']],
  'Tune a neuron by hand': ['A neuron weighs each input, adds them up, and makes a call.', 'Set how much each input counts until the neuron is right about at least 43 of 48 customers.', ['A big negative weight pushes towards “leave”.', 'One neuron can only draw one straight dividing line.']],
  'Weights are what a network learns': ['Everything a network knows is stored in its weights and biases.', '', ['Weight: how much an input counts.', 'Bias: the neuron’s starting lean.', 'Training is the process of adjusting these numbers.']],
  'Fit a curve that rises and falls': ['Switches, called activation functions, let a network bend straight lines into curves.', 'Find the fewest switches that can make a peak around day 30.', ['Without switches, only straight lines are possible.', 'Two switches make a rise and a fall.']],
  'Straight line or curve?': ['Steady trends fit a straight line; peaks, dips and bands need switches.', 'Sort each pattern: straight line, or curve?', ['One direction: straight line.', 'Up then down: curve.']],
  'Stack neurons into layers': ['Layers of neurons with switches can learn complex shapes.', 'Try each network, then turn the switches off.', ['Switches off: all the layers collapse into one straight line.', 'Too many layers for the data, and it starts memorising.']],
  'Follow one customer through the network': ['Numbers flow forward to a prediction; the error flows back to nudge every weight.', 'Press Play, or step through.', ['Forward: make a prediction.', 'Check: compare it with what really happened.', 'Back: nudge every weight a little.']],
  'Watch a network learn': ['Training is many rounds of small nudges that make the network less wrong.', 'Train the network to the last round.', ['It starts with random weights and poor guesses.', 'Each round fixes a little of the error.']],
  'One training round': ['One training round: predict, measure the miss, nudge every weight.', 'Put the steps in order.', ['Repeat it thousands of times.']],
  'From 17 numbers to billions': ['Language models use these same parts at an enormous scale, alongside a few others such as attention.', 'Tap each part to see what it does.', ['Billions of weights, tuned the same way.', 'Attention, which you’ll meet later, is the main new part.']],
  'The tools engineers build with': ['Engineers build networks with free code libraries such as PyTorch and TensorFlow.', '', ['They do the maths automatically.', 'You don’t need them to use AI tools.']]
};

SLIDES['cnn'] = {
  'To a computer, a picture is numbers': ['To a computer, a picture is a grid of numbers: one number per pixel.', '', ['Dark pixels are low numbers; bright pixels are high.', 'A real photo has millions of them.', 'A CNN is a network built to find patterns in grids like this.']],
  'Slide a filter across the picture': ['A filter is a tiny pattern-spotter that scores how well each patch of the picture matches it.', 'Move the window to where the filter scores highest.', ['The filter is a 3 × 3 grid of weights.', 'High score: this patch matches the pattern.', 'This one spots left edges.']],
  'That’s a convolution': ['Sliding one filter across the whole picture finds its pattern anywhere.', '', ['That sliding is called a convolution.', 'The result is a feature map that lights up where the pattern is.', 'The same 9 weights work everywhere in the picture.']],
  'Which filter finds the top edge?': ['Each filter spots a different pattern. A CNN learns many of them.', 'Try each filter and pick the one that lights up along the top edge.', ['One filter finds top edges, another left edges, another corners.', 'Nobody writes them: they’re learned from examples.']],
  'Control how the filter moves': ['You choose how far the filter jumps each step, and whether to pad the border.', 'Make the feature map the same size as the picture: 8 × 8.', ['Stride: how far it jumps. Bigger jumps make a smaller map.', 'Padding: a border of zeros so edge pixels get a full turn.']],
  'Colour pictures have channels': ['A colour picture is three grids stacked: red, green and blue.', '', ['A colour filter looks at all three at once.', 'Every filter makes its own map, and the next layer reads them all.']],
  'Pooling shrinks the map': ['Pooling shrinks a map by keeping only the strongest score in each small patch.', '', ['It keeps “there’s an edge around here” and drops the exact pixel.', 'Smaller maps mean less computing.']],
  'Layers build up from edges to objects': ['Early layers find edges; later layers combine them into shapes, parts and whole objects.', '', ['Each layer reads the maps from the layer before.', 'The final layer turns it all into an answer.', 'All the filters are learned from labelled pictures.']],
  'The moment CNNs took off': ['In 2012, a CNN beat every other approach at recognising photos by a wide margin.', '', ['Its top-5 error was 15.3%; the runner-up’s was 26.2%.', 'That gap set off the deep learning boom in image recognition.']],
  'Three questions about one photo': ['Image AI answers one of three questions: what is it, where is it, or exactly which pixels.', '', ['What: classification.', 'Where: detection, with boxes.', 'Which pixels: segmentation.', 'Each one needs more labelling work than the last.']],

/* Data science in depth, lesson 2: Samples and uncertainty. Original examples; all data made up for illustration.

  const { fmt, mean, sd, quantile, rng, gauss, hist, line, table, stats, cards, note, normPdf, path } = DS;
  const seg = Lesson.ui.seg, money = v => '$' + fmt(v);
  // ---------- data ----------
  const POP = (() => { const r = rng(101); return [...Array(5000)].map(() => Math.exp(5.3 + 0.55 * gauss(r))); })();
  const PM = mean(POP), PSD = sd(POP);

  const BOOT = (() => { const r = rng(404); return [...Array(1000)].map(() => { let s = 0; for (let k = 0; k < 30; k++) s += SAMPLE[Math.floor(r() * 30)]; return s / 30; }); })();

  const choose = (n, k) => { let c = 1; for (let i = 1; i <= k; i++) c = c * (n - k + i) / i; return c; };

    { n: 'Binomial', t: 'How many of 20 orders get returned, if each has a 10% chance?', d: 'Counts “successes” in a fixed number of tries, each with the same chance.', bars: [...Array(9)].map((_, k) => [k, choose(20, k) * 0.1 ** k * 0.9 ** (20 - k)]), xl: 'Orders returned out of 20' },

    { n: 'Exponential', t: 'How long until the next support call, if calls average one every 15 minutes?', d: 'The waiting time between events that arrive at a steady average rate.', f: x => Math.exp(-x / 15) / 15, x1: 75, y1: 0.075, xl: 'Minutes until the next call' },

  function normalVis() {

      under: (sx, sy) => [[2, 'var(--brand-soft)'], [1, 'color-mix(in srgb, var(--brand) 35%, var(--card))']].map(([z, c]) => { let d = `M${sx(-z)},${sy(0)}`; for (let k = 0; k <= 60; k++) { const x = -z + 2 * z * k / 60; d += `L${sx(x)},${sy(normPdf(x))}`; } return `<path d="${d}L${sx(z)},${sy(0)}Z" fill="${c}"/>`; }).join(''),

  DS.lesson({ id: 'ds-sampling', state: { rq: 0, ns: 0, sdone: [], boot: 0, lv: 1, dv: 0, dseen: [0] }, screens: [
    K.q('A supplier shows 4.8 stars from 2,000 online reviews. What’s the biggest risk in trusting that number?', ['2,000 reviews is too few', 'The people who chose to review may not be typical buyers', 'Star ratings can’t be averaged', 'None: a big sample is always right'], 1,
      'Reviewers pick themselves, and very happy or very unhappy buyers write the most. A big sample of the wrong people is still the wrong people.', { chapter: 'Samples and bias', eyebrow: 'Think about it' }),

    { type: 'concept', title: 'A small fair sample beats a huge biased one',
      text: '<p>The <b>population</b> is everyone you want to know about; the <b>sample</b> is the part you actually measure. In a <b>random sample</b>, every member has the same chance of being picked. <b>Sample bias</b> means the sample differs from the population in a systematic way that more data won’t fix.</p><p>The classic case: in 1936 the Literary Digest polled over 10 million people, mostly its own subscribers and people on car and telephone lists, and predicted Alf Landon would beat Franklin Roosevelt. George Gallup polled about 2,000 people and correctly predicted Roosevelt (Bruce and Bruce, 2017).</p>',

    { type: 'concept', title: 'Look hard enough and something always turns up',
      text: '<p><b>Selection bias</b> also creeps in when you choose what to report. Slice the data enough ways, by region, product, month and rep, and some slice will look remarkable by chance alone. This is sometimes called the vast search effect, or data snooping. The protection is to decide the question before looking, and to check any discovery on data you held back (Bruce and Bruce, 2017).</p>',

      text: '<p>Each rep’s quarterly sales are their skill plus some luck. Here are this quarter’s top 5. <b>Run next quarter and see how far ahead they stay.</b></p>',
      vis: ctx => repsVis(ctx.state), enter: ctx => { ctx.state.rq = 0; },
      click: (e, ctx) => { const b = e.target.closest('[data-rq]'); if (!b) return false; ctx.state.rq = 1; ctx.refresh(); return true; },
      goal: ctx => ctx.state.rq === 1, solve: "document.querySelector('[data-rq]').click()",
      ok: `The top 5 were ${fmt(LEAD1)}k ahead in Q1 but only ${fmt(LEAD2)}k ahead in Q2. They’re still good, but part of their lead was luck, and luck doesn’t repeat. This is regression to the mean, first described by Francis Galton in 1886 (Bruce and Bruce, 2017).`,
      no: 'Press “Run next quarter”.',
      slide: ['Extreme results tend to be followed by less extreme ones, because part of any standout result is luck.', 'Run next quarter and see how far ahead the top reps stay.', ['This is called regression to the mean.', 'Don’t credit a new process for a recovery that would have happened anyway.', 'Don’t blame one for a slip either.']],
      pred: { q: 'This quarter’s top 5 reps beat the average by a lot. Next quarter, on average, they will…', o: ['Do even better', 'Stay about as far ahead', 'Slip back towards the average'], a: 2, why: 'Part of their lead was luck. Next quarter their luck is just average, so they slip back towards the middle, while staying above it because their skill is real.' } },
    K.q('A rep has a record quarter after a new training course. What’s the main caution?', ['None: the course worked', 'Record quarters are often followed by more ordinary ones, so compare with reps who didn’t take the course', 'The record must be a data error', 'Sales can’t be measured'], 1, 'Some of a record result is luck, which won’t repeat. A fair comparison group is the way to tell whether the course helped.'),

    ...DSS.lead('How much estimates wobble', DSS.probability),
    { type: 'task', title: 'Draw sample after sample',
      text: '<p>Orders are lopsided: most are modest, a few are huge. Imagine taking a sample of orders, averaging it, and repeating that 500 times. The spread of those averages is called the <b>sampling distribution</b>. <b>Draw 500 samples of 5 orders, then of 100.</b></p>',
      vis: ctx => meansVis(ctx.state), enter: ctx => { ctx.state.ns = 0; ctx.state.sdone = []; },
      click: (e, ctx) => { const a = e.target.closest('[data-ns]'), b = e.target.closest('[data-draw]'); if (a) { ctx.state.ns = +a.dataset.ns; ctx.refresh(); return true; } if (b) { if (!ctx.state.sdone.includes(ctx.state.ns)) ctx.state.sdone.push(ctx.state.ns); ctx.refresh(); return true; } return false; },
      goal: ctx => ctx.state.sdone.includes(0) && ctx.state.sdone.includes(2), solve: "document.querySelector('[data-draw]').click();document.querySelector('[data-ns=\"2\"]').click();document.querySelector('[data-draw]').click()",
      ok: () => `With 5 orders per sample, the averages spread from about ${money(quantile(MEANS[0], 0.05))} to ${money(quantile(MEANS[0], 0.95))}. With 100, they bunch tightly around the true ${money(PM)}, in a bell shape, even though single orders are lopsided. That bell is the central limit theorem at work.`,
      no: ctx => ctx.state.sdone.includes(0) ? 'Now switch to 100 orders per sample and draw again.' : 'Press “Draw 500 samples” with 5 orders per sample first.',
      slide: ['Averages of bigger samples cluster more tightly around the truth, and their spread forms a bell shape.', 'Draw 500 samples of 5 orders, then of 100.', ['The spread of the averages is the sampling distribution.', 'Its bell shape is the central limit theorem.', 'It holds even when single values are lopsided.']],
      pred: { q: 'You take many samples of orders and average each one. As the samples get bigger, the averages will…', o: ['Spread out more', 'Cluster more tightly around the true average', 'Stay just as spread out'], a: 1, why: 'Big samples average out the luck of individual orders, so their averages land close to the truth, and close to each other.' } },
    { type: 'concept', title: 'The standard error',
      text: '<p>The spread of the sample averages has a name: the <b>standard error</b>. It’s roughly the standard deviation of the data divided by the square root of the sample size. Because of that square root, four times the data only halves the error. Don’t confuse the two: the standard deviation describes single values; the standard error describes an estimate (Bruce and Bruce, 2017).</p>',
      vis: () => `${stats([25, 100, 400].map(n => ['Sample of ' + n, '± ' + money(PSD / Math.sqrt(n)), n === 100 ? 'brand' : '']))}${note('Standard error of the average order for different sample sizes, from the made-up population.')}`,
      slide: ['The standard error says how far a sample’s estimate is likely to be from the truth. Four times the data halves it.', '', ['Standard error ≈ standard deviation ÷ √(sample size).', 'Standard deviation: how single values vary.', 'Standard error: how an estimate varies.']] },
    K.q('To cut the standard error of an average in half, how much more data do you need?', ['Twice as much', 'Four times as much', 'Ten times as much', 'It can’t be cut'], 1, 'The error shrinks with the square root of the sample size, so halving it takes four times the data.'),
    { type: 'task', title: 'The bootstrap: resample your own sample',
      text: '<p>Usually you have just one sample. The <b>bootstrap</b> estimates how much it could wobble by drawing new samples from it, with replacement: pick 30 orders from your 30 at random, allowing repeats, average them, and do it again and again. The statistician Bradley Efron developed the idea in the late 1970s (Bruce and Bruce, 2017). <b>Resample 1,000 times.</b></p>',
      vis: ctx => bootVis(ctx.state), enter: ctx => { ctx.state.boot = 0; },
      click: (e, ctx) => { const b = e.target.closest('[data-boot]'); if (!b) return false; ctx.state.boot = 1; ctx.refresh(); return true; },
      goal: ctx => ctx.state.boot === 1, solve: "document.querySelector('[data-boot]').click()",
      ok: () => { const [lo, hi] = ci(0.9); return `The middle 90% of the resampled averages runs from ${money(lo)} to ${money(hi)}: a 90% interval for the average order, worked out from one sample and no formulas. The true average is ${money(PM)}.`; },
      no: 'Press “Resample 1,000 times”.',
      slide: ['The bootstrap resamples your one sample, with repeats, to see how much an estimate could wobble.', 'Resample 1,000 times.', ['No formulas needed: it works for medians and other stats too.', 'The middle 90% of resampled results is a 90% interval.']] },
    { type: 'concept', title: 'Confidence intervals',
      text: '<p>A <b>confidence interval</b> gives a range instead of a single number. A 90% interval comes from a method that, used again and again on new samples, would catch the true value about 90% of the time. Asking for more confidence widens the range; more data narrows it.</p>',
      vis: ctx => ciVis(ctx.state),
      click: (e, ctx) => { const b = e.target.closest('[data-lv]'); if (!b) return false; ctx.state.lv = +b.dataset.lv; ctx.refresh(); return true; },
      slide: ['A confidence interval gives a range for the true value. More confidence means a wider range; more data means a narrower one.', 'Switch between confidence levels.', ['90%: the method catches the truth about 9 times in 10.', 'Report the range, not just the single number.']] },
    K.q('An analyst reports average order value as “$230, 95% interval $205 to $258”. What’s the best reading?', ['Exactly 95% of orders are between $205 and $258', 'The true average is probably in that range: the method catches it 95% of the time', 'The average is definitely $230', 'The data is 95% accurate'], 1, 'The interval is about the true average, not single orders. It comes from a method that catches the truth 95 times in 100.'),

    { type: 'concept', chapter: 'Common shapes of data', title: 'The normal curve',
      text: '<p>The <b>normal distribution</b> is the classic bell curve: about 68% of values fall within one standard deviation of the average and about 95% within two. It describes sampling distributions and errors well, but most raw business data, like order sizes, isn’t normal. A <b>QQ-plot</b> checks: if the data is normal, its points fall on a straight line (Bruce and Bruce, 2017).</p>',
      vis: () => normalVis(),
      slide: ['The normal curve is the classic bell: about 68% of values within one standard deviation, 95% within two.', '', ['It fits sample averages and errors well.', 'Raw business data often isn’t normal.', 'A QQ-plot checks: normal data falls on a straight line.']] },
    { type: 'concept', title: 'Long tails',
      text: '<p>Many real quantities have <b>long tails</b>: extreme values turn up far more often than a normal curve would predict. Daily sales, claim sizes and market returns are common examples. Assuming normality there underestimates the chance of a very bad day.</p>',
      vis: () => tailVis(),
      slide: ['In long-tailed data, extreme values happen far more often than a bell curve predicts.', '', ['Sales, claims and returns often have long tails.', 'Plan for extremes; don’t assume the bell.']] },
    { type: 'task', title: 'A gallery of distributions',
      text: '<p>A few other shapes come up again and again. Each answers a particular kind of question. <b>Look at all five.</b></p>',
      vis: ctx => distVis(ctx.state), enter: ctx => { ctx.state.dv = 0; ctx.state.dseen = [0]; },
      click: (e, ctx) => { const b = e.target.closest('[data-dv]'); if (!b) return false; ctx.state.dv = +b.dataset.dv; if (!ctx.state.dseen.includes(ctx.state.dv)) ctx.state.dseen.push(ctx.state.dv); ctx.refresh(); return true; },
      goal: ctx => ctx.state.dseen.length === DIST.length, solve: "[1,2,3,4].forEach(k=>document.querySelector('[data-dv=\"'+k+'\"]').click())",
      ok: 'Counts of yes/no outcomes: binomial. Counts of events in a period: Poisson. Waiting times: exponential, or Weibull when the rate changes with age. Small-sample estimates: t, first published in 1908 by W. S. Gosset under the pen name “Student” (Bruce and Bruce, 2017).',
      no: 'Tap each of the five shapes.',
      slide: ['Each common distribution fits one kind of question: counts, events, waiting times or small samples.', 'Look at all five.', ['Binomial: how many yeses out of n tries.', 'Poisson: events per hour; exponential: time between them.', 'Weibull: time to failure; t: small-sample estimates.']] },
    K.q('You want the chance of getting 3 or more support calls in the next 10 minutes. Which distribution fits?', ['Binomial', 'Poisson', 'Normal', 'Weibull'], 1, 'Counting events that arrive at a steady average rate over a period is the Poisson distribution’s job.'),
    K.recap([['Sample fairly', 'A small random sample beats a huge biased one.'], ['Beware snooping', 'Look hard enough and something will turn up by chance.'], ['Luck regresses', 'Standout results tend to fall back towards average.'], ['Estimates wobble', 'Standard errors, the bootstrap and confidence intervals measure how much.'], ['Know the shapes', 'Normal, long-tailed, binomial, Poisson, exponential, Weibull and t.']],
      { next: 'Experiments and significance: is a difference real, or just chance?' })
  ] }, {
    plain: {
      'Samples and bias': ['A sample only tells you about everyone if it was picked fairly.', 'Tasting soup: one well-stirred spoonful is enough; a hundred spoonfuls off the top aren’t.', 'Surveys, reviews and pilot results are only as good as who was in them.'],
      'How much estimates wobble': ['Any number from a sample would come out a bit different from another sample. Statistics measures how much.', 'Weighing yourself on five slightly different scales.', 'A range like “$205 to $258” is more honest than one number.'],
      'Common shapes of data': ['Data tends to follow a few common shapes, and each fits a different kind of question.', 'Knowing whether you’re counting, waiting or measuring tells you which shape to expect.', 'The wrong shape gives the wrong odds, especially for extreme events.']
    },
    cur: { min: 29, builds: ['ds-explore'], drop: [],
      objectives: ['Spot sample bias, selection bias and regression to the mean, and read a probability correctly.', 'Explain sampling distributions, standard errors, the bootstrap and confidence intervals.', 'Recognise the normal, long-tailed, binomial, Poisson, exponential, Weibull and t distributions.'],
      why: 'Almost every number in a report comes from a sample. This lesson is about how far to trust it.',
      defs: {
        'Survey your customers': [['Sample', 'The part of a group you actually measured.'], ['Sampling bias', 'When the people measured differ in a systematic way from the whole group.']],
        'What “70% likely” really means': [['Probability', 'How often something happens across many similar cases.', '70% means about 7 in 10.']],
        'A small fair sample beats a huge biased one': [['Random sample', 'A sample where every member of the population had the same chance of being picked.'], ['Sample bias', 'A sample that differs from the population in a systematic way.']],
        'Look hard enough and something always turns up': [['Selection bias', 'Bias from the way data, results or slices were chosen.']],
        'The top reps slip back': [['Regression to the mean', 'Extreme results tend to be followed by more ordinary ones, because part of the extreme was luck.']],
        'Draw sample after sample': [['Sampling distribution', 'How a statistic, like an average, varies across many samples.'], ['Central limit theorem', 'Averages of large samples follow a bell shape, even when single values don’t.']],
        'The standard error': [['Standard error', 'The typical amount a sample’s estimate is off from the true value.']],
        'The bootstrap: resample your own sample': [['Bootstrap', 'Estimating uncertainty by repeatedly resampling your own data, with replacement.']],
        'Confidence intervals': [['Confidence interval', 'A range from a method that catches the true value a stated share of the time.', '90% of the time']],
        'The normal curve': [['Normal distribution', 'The bell curve: 68% of values within one standard deviation of the average.'], ['QQ-plot', 'A chart that checks whether data is normal: normal data falls on a straight line.']],
        'Long tails': [['Long tail', 'A shape where extreme values are much more common than in a bell curve.']],
        'A gallery of distributions': [['Binomial distribution', 'The number of yeses in a fixed number of tries.'], ['Poisson distribution', 'The number of events in a period, at a steady average rate.']]
      } }
  });
