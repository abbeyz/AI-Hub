<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How AI Works</title>
<style>/* Lesson player: one idea per screen, do first, then explain. */
:root {
  --paper: #FBF7F0; --card: #FFFFFF; --ink: #1D1B22; --ink-2: #45424D; --mute: #7C7884; --rule: #E8E1D5; --edge: #1D1B22;
  --brand: #5546FF; --brand-soft: #ECEAFF;
  --ok: #188A4A; --ok-bg: #E2F5E9; --ok-edge: #0F6A37; --no: #D93A50; --no-bg: #FCE6E9; --no-edge: #A82337;
  --c1: #FF8A3D; --c2: #14A39B; --c3: #7B61FF; --c4: #FFC23D; --c5: #F2547D;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Avenir Next", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #16151A; --card: #201E26; --ink: #F4F0E8; --ink-2: #CFCAD5; --mute: #9C97A6; --rule: #322F3A; --edge: #000000;
    --brand: #8B80FF; --brand-soft: #2A2650; --ok: #3CC777; --ok-bg: #12301F; --ok-edge: #0B1F14; --no: #FF6B7F; --no-bg: #3A1B22; --no-edge: #24090F; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; }
.lp { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
.lp-top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--paper); }
.lp-x { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--rule); background: transparent; color: var(--mute); font-size: 1rem; font-weight: 800; cursor: pointer; flex: none; }
.lp-x:hover { color: var(--ink); border-color: var(--ink); }
.lp-prog { flex: 1; display: flex; gap: 5px; }
.lp-prog span { flex: 1; height: 10px; border-radius: 6px; background: var(--rule); transition: background .3s; }
.lp-prog span { background: linear-gradient(90deg, var(--brand) 0 var(--f, 0%), var(--rule) var(--f, 0%)); }
.lp-prog span.done { background: var(--brand); }
.lp-main { width: min(720px, 100%); margin: 0 auto; padding: 10px 20px 190px; outline: none; }
.scr { display: grid; gap: 18px; animation: lp-in .35s ease both; }
@keyframes lp-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .scr { animation: none; } }
.eyebrow { font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); margin: 0; }
.scr h1 { font-size: clamp(1.55rem, 4.2vw, 2.15rem); line-height: 1.15; margin: 0; letter-spacing: -.015em; font-weight: 850; }
.txt { font-size: 1.16rem; line-height: 1.58; color: var(--ink-2); }
.txt p { margin: 0 0 .55em; } .txt p:last-child { margin: 0; }
.txt b { color: var(--ink); }
.vis { background: var(--card); border: 2px solid var(--rule); border-radius: 24px; padding: 18px; display: grid; gap: 14px; }
.vis.bare { background: transparent; border: 0; padding: 0; }
/* tactile buttons and tiles */
.btn3d { font-weight: 800; font-size: 1.04rem; padding: 13px 24px; border-radius: 16px; border: 2px solid var(--edge); background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--edge); cursor: pointer; transition: transform .05s, box-shadow .05s; }
.btn3d:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.btn3d.primary { background: var(--ink); color: var(--paper); min-width: 170px; }
@media (prefers-color-scheme: dark) { .btn3d.primary { background: var(--brand); color: #fff; border-color: #2B2380; box-shadow: 0 4px 0 #2B2380; } .btn3d { border-color: #3D3946; box-shadow: 0 4px 0 #0B0A0E; } }
.btn3d:disabled { opacity: .35; cursor: default; }
.tiles { display: grid; gap: 12px; }
.tile { text-align: left; font-size: 1.07rem; line-height: 1.4; padding: 15px 18px; border-radius: 16px; background: var(--card); color: var(--ink); border: 2px solid var(--rule); box-shadow: 0 4px 0 var(--rule); cursor: pointer; display: flex; gap: 12px; align-items: center; transition: transform .05s, box-shadow .05s, border-color .15s; }
.tile:hover:not(:disabled) { border-color: var(--ink-2); }
.tile:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--rule); }
.tile .key { flex: none; width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--rule); display: grid; place-items: center; font-size: .82rem; font-weight: 800; color: var(--mute); }
.tile.sel { border-color: var(--brand); box-shadow: 0 4px 0 var(--brand); background: var(--brand-soft); }
.tile.sel .key { border-color: var(--brand); background: var(--brand); color: #fff; }
.tile.ok { border-color: var(--ok); box-shadow: 0 4px 0 var(--ok); background: var(--ok-bg); }
.tile.ok .key { border-color: var(--ok); background: var(--ok); color: #fff; }
.tile.no { border-color: var(--no); box-shadow: 0 4px 0 var(--no); background: var(--no-bg); }
.tile.no .key { border-color: var(--no); background: var(--no); color: #fff; }
.tile:disabled { cursor: default; }
/* segmented toggle */
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; padding: 5px; border-radius: 16px; background: var(--rule); }
.seg button { border: 0; background: transparent; color: var(--ink-2); font-weight: 800; padding: 9px 16px; border-radius: 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--edge); }
/* chunky slider */
.slide { display: grid; gap: 8px; }
.slide label { font-weight: 800; display: flex; justify-content: space-between; gap: 10px; }
.slide label output { font-family: var(--mono); color: var(--brand); }
.slide input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; border-radius: 10px; background: var(--rule); outline: none; }
.slide input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: var(--brand); border: 3px solid var(--card); box-shadow: 0 0 0 2px var(--brand), 0 3px 0 2px var(--edge); cursor: grab; }
.slide input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--brand); border: 3px solid var(--card); box-shadow: 0 0 0 2px var(--brand); cursor: grab; }
/* numbers */
.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.num { border-radius: 16px; background: var(--paper); padding: 12px 14px; display: grid; gap: 2px; }
.num span { font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.num b { font-size: 1.75rem; font-weight: 850; letter-spacing: -.02em; }
.num small { color: var(--mute); }
.num.hl b { color: var(--brand); } .num.bad b { color: var(--no); } .num.good b { color: var(--ok); }
/* charts */
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { font: 600 12px var(--font); fill: var(--mute); }
svg.chart .axl { font-weight: 800; fill: var(--ink-2); }
svg.chart .lbl { font-weight: 800; font-size: 13px; }
/* data table */
.dt { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: .95rem; }
.dt th { text-align: left; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); padding: 0 10px; }
.dt td { background: var(--paper); padding: 10px; border-top: 2px solid transparent; border-bottom: 2px solid transparent; }
.dt td:first-child { border-left: 2px solid transparent; border-radius: 12px 0 0 12px; font-family: var(--mono); font-size: .85rem; }
.dt td:last-child { border-right: 2px solid transparent; border-radius: 0 12px 12px 0; text-align: right; width: 34px; }
.dt tr.row { cursor: pointer; }
.dt tr.row:hover td { border-color: var(--rule); }
.dt tr.flag td { background: var(--no-bg); border-color: var(--no); }
.dt tr.fixed td { background: var(--ok-bg); }
.dt tr.gone td { opacity: .45; text-decoration: line-through; }
.dtw { overflow-x: auto; }
/* bottom bar and feedback */
.lp-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--paper); border-top: 2px solid var(--rule); transition: background .2s; }
.lp-bar.ok { background: var(--ok-bg); border-top-color: var(--ok); }
.lp-bar.no { background: var(--no-bg); border-top-color: var(--no); }
.lp-inner { width: min(720px, 100%); margin: 0 auto; padding: 14px 20px 18px; display: grid; gap: 12px; }
.lp-fb { display: none; animation: lp-up .25s ease both; }
@keyframes lp-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.lp-bar.ok .lp-fb, .lp-bar.no .lp-fb { display: grid; gap: 4px; }
.lp-fb h3 { margin: 0; font-size: 1.3rem; font-weight: 850; display: flex; align-items: center; gap: 10px; }
.lp-bar.ok .lp-fb h3 { color: var(--ok); } .lp-bar.no .lp-fb h3 { color: var(--no); }
.lp-fb p { margin: 0; font-size: 1.02rem; line-height: 1.5; color: var(--ink-2); }
.lp-badge { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 1rem; }
.lp-bar.ok .lp-badge { background: var(--ok); } .lp-bar.no .lp-badge { background: var(--no); }
.lp-actions { display: flex; gap: 12px; justify-content: space-between; align-items: center; }
.lp-back { border: 0; background: transparent; color: var(--mute); font-weight: 800; cursor: pointer; padding: 10px 4px; }
.lp-back:hover { color: var(--ink); }
.lp-bar.ok .btn3d.primary { background: var(--ok); border-color: var(--ok-edge); box-shadow: 0 4px 0 var(--ok-edge); color: #fff; }
.lp-bar.no .btn3d.primary { background: var(--no); border-color: var(--no-edge); box-shadow: 0 4px 0 var(--no-edge); color: #fff; }
/* illustration helpers */
.chatcard { display: grid; gap: 12px; }
.chatrow { display: flex; gap: 12px; align-items: flex-start; }
.avatar { width: 44px; height: 44px; flex: none; border-radius: 14px; background: var(--c3); display: grid; place-items: center; border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); }
.bubble2 { background: var(--paper); border-radius: 4px 18px 18px 18px; padding: 14px 16px; font-size: 1.05rem; line-height: 1.5; }
.bubble2 .big { display: block; font-size: 2.6rem; font-weight: 900; letter-spacing: -.03em; color: var(--ink); line-height: 1.1; margin-top: 4px; }
.sticker { justify-self: end; transform: rotate(-4deg); background: var(--c4); color: #1D1B22; font-weight: 850; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); }
.recap { display: grid; gap: 12px; }
.recap div { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; background: var(--card); border: 2px solid var(--rule); border-radius: 18px; padding: 14px; }
.recap i { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-style: normal; font-size: 1.4rem; font-weight: 900; color: #1D1B22; border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); }
.recap b { display: block; font-size: 1.08rem; } .recap span { color: var(--ink-2); line-height: 1.45; }
.legend2 { display: flex; flex-wrap: wrap; gap: 14px; font-weight: 700; font-size: .9rem; color: var(--ink-2); }
.legend2 i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--edge); margin-right: 6px; vertical-align: -2px; }
.quote { font-size: 1.15rem; font-weight: 700; padding: 14px 18px; border-left: 5px solid var(--c4); background: var(--card); border-radius: 0 16px 16px 0; }
.score { text-align: center; display: grid; gap: 6px; padding: 10px; }
.score b { font-size: 3rem; font-weight: 900; letter-spacing: -.03em; color: var(--brand); }
@media (max-width: 560px) { .txt { font-size: 1.07rem; } .lp-main { padding-bottom: 210px; } .btn3d.primary { min-width: 0; flex: 1; } }

@media (max-width: 560px) {
  .dt { font-size: .8rem; border-spacing: 0 5px; }
  .dt td { padding: 8px 5px; }
  .dt th { padding: 0 5px; font-size: .62rem; }
  .dt td:first-child { font-size: .72rem; }
  .dt td:last-child, .dt th:last-child { display: none; }
  .dt td:nth-last-child(2) { border-right: 2px solid transparent; border-radius: 0 12px 12px 0; }
  .dt tr.flag td:nth-last-child(2) { border-right-color: var(--no); }
}
@media (max-width: 560px) { svg.chart text { font-size: 19px; } svg.chart .lbl { font-size: 20px; } }

/* ---------- chapters in the top bar ---------- */
.lp-pw { flex: 1; display: grid; gap: 6px; min-width: 0; }
.lp-chap { display: flex; gap: 8px; align-items: baseline; font-size: .78rem; font-weight: 800; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lp-chap b { color: var(--ink); }
.lp-chap span:not(:empty)::before { content: '·'; margin-right: 8px; }
.lp-prog { gap: 6px; }
.lp-prog span { height: 10px; border-radius: 6px; }

/* ---------- concept blocks ---------- */
.bigidea { display: grid; gap: 6px; padding: 22px; border-radius: 22px; background: var(--brand); color: #fff; border: 2px solid var(--edge); box-shadow: 0 5px 0 var(--edge); }
.bigidea b { font-size: clamp(1.25rem, 3.4vw, 1.6rem); line-height: 1.25; font-weight: 850; letter-spacing: -.01em; }
.bigidea span { opacity: .9; line-height: 1.5; }
.terms2 { display: grid; gap: 10px; }
.terms2 div { display: grid; grid-template-columns: minmax(110px, 180px) 1fr; gap: 14px; padding: 12px 14px; border-radius: 16px; background: var(--paper); align-items: baseline; }
.terms2 b { font-weight: 850; } .terms2 span { color: var(--ink-2); line-height: 1.45; }
.myth2 { display: grid; gap: 8px; }
.myth2 p { margin: 0; padding: 12px 14px; border-radius: 16px; line-height: 1.45; display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: baseline; }
.myth2 p:first-child { background: var(--no-bg); } .myth2 p:last-child { background: var(--ok-bg); }
.myth2 .m, .myth2 .f { font-size: .72rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
.myth2 .m { color: var(--no); } .myth2 .f { color: var(--ok); }
.pics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.pic { border-radius: 18px; padding: 14px; background: var(--paper); display: grid; gap: 6px; align-content: start; }
.pic i { font-style: normal; width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-weight: 900; font-size: 1.1rem; color: #1D1B22; border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); }
.pic b { font-size: 1.02rem; } .pic span { color: var(--ink-2); font-size: .95rem; line-height: 1.45; }
.flow2 { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.flow2 > div { flex: 1 1 120px; border-radius: 16px; padding: 12px; background: var(--paper); display: grid; gap: 4px; align-content: start; border: 2px solid transparent; }
.flow2 > div.hl { border-color: var(--brand); background: var(--brand-soft); }
.flow2 > i { align-self: center; font-style: normal; font-weight: 900; color: var(--mute); }
.flow2 b { font-size: .98rem; } .flow2 span { font-size: .88rem; color: var(--ink-2); line-height: 1.4; }
.flow2 em { font-style: normal; font-size: .72rem; font-weight: 900; color: var(--brand); }
@media (max-width: 560px) { .flow2 { flex-direction: column; } .flow2 > i { transform: rotate(90deg); align-self: center; } .terms2 div { grid-template-columns: 1fr; gap: 2px; } }

/* ---------- activities ---------- */
.act-lbl { margin: 0; font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.chip3d { font: inherit; font-weight: 700; font-size: .98rem; line-height: 1.35; text-align: left; padding: 11px 14px; border-radius: 14px; background: var(--card); color: var(--ink); border: 2px solid var(--rule); box-shadow: 0 3px 0 var(--rule); cursor: pointer; display: flex; gap: 10px; align-items: center; transition: transform .05s, box-shadow .05s; }
.chip3d:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--rule); }
.chip3d:hover { border-color: var(--ink-2); }
.chip3d .n { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-size: .8rem; font-weight: 900; }
.chip3d.sel { border-color: var(--brand); box-shadow: 0 3px 0 var(--brand); background: var(--brand-soft); }
.chip3d.ok { border-color: var(--ok); box-shadow: 0 3px 0 var(--ok); background: var(--ok-bg); }
.chip3d.ok .n { background: var(--ok); color: #fff; }
.chip3d.no { border-color: var(--no); box-shadow: 0 3px 0 var(--no); background: var(--no-bg); }
.chip3d.no .n { background: var(--no); color: #fff; }
.chip3d .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--pc); border: 2px solid var(--edge); }
.chip3d[style*="--pc"]:not(.ok):not(.no) { border-color: var(--pc); box-shadow: 0 3px 0 var(--pc); }
.act-ord { display: grid; gap: 14px; }
.act-ord .pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; padding: 12px; border-radius: 18px; background: var(--paper); }
.act-done { color: var(--mute); font-weight: 700; align-self: center; }
.act-ord .placed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.act-ord .placed .chip3d { width: 100%; }
.act-ord .slot { height: 50px; border-radius: 14px; border: 2px dashed var(--rule); display: flex; align-items: center; padding-left: 14px; }
.act-ord .slot span { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--rule); display: grid; place-items: center; font-size: .8rem; font-weight: 900; color: var(--mute); }
.act-match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.act-match .col { display: grid; gap: 8px; align-content: start; }
.act-match .chip3d { width: 100%; min-height: 54px; }
.act-sort, .act-pick { display: grid; gap: 10px; }
.sitem, .pitem { display: grid; gap: 10px; padding: 14px; border-radius: 18px; background: var(--paper); border: 2px solid transparent; }
.sitem p { margin: 0; font-weight: 700; line-height: 1.4; }
.sitem.ok, .pitem.ok { border-color: var(--ok); background: var(--ok-bg); }
.sitem.no { border-color: var(--no); background: var(--no-bg); }
.sitem small, .pitem small { color: var(--ink-2); line-height: 1.45; font-size: .92rem; }
.sitem .seg { justify-self: start; }
.words2 { display: flex; flex-wrap: wrap; gap: 6px; }
.words2 .w { font: inherit; font-weight: 700; padding: 7px 11px; border-radius: 11px; border: 2px solid var(--rule); background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--rule); cursor: pointer; }
.words2 .w.sel { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 2px 0 var(--brand); }
.words2 .w.ok { border-color: var(--ok); background: var(--ok-bg); box-shadow: 0 2px 0 var(--ok); }
.words2 .w.no { border-color: var(--no); background: var(--no-bg); box-shadow: 0 2px 0 var(--no); }
@media (max-width: 560px) { .act-match { gap: 8px; } .act-match .chip3d { font-size: .88rem; padding: 9px 10px; } }

/* ---------- finish screen ---------- */
.done-hero { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 18px 10px 6px; }
.done-hero .medal { width: 92px; height: 92px; border-radius: 30px; background: var(--c4); border: 3px solid var(--edge); box-shadow: 0 6px 0 var(--edge); display: grid; place-items: center; font-size: 2.6rem; transform: rotate(-6deg); animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes pop { from { transform: scale(.4) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(-6deg); opacity: 1; } }
.done-hero b { font-size: 2.2rem; font-weight: 900; letter-spacing: -.02em; color: var(--brand); }
.done-hero span { color: var(--ink-2); }
.upnext { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 18px; border: 2px dashed var(--brand); color: var(--ink-2); line-height: 1.45; }
.upnext b { color: var(--ink); }
/* equation cards: inputs → outputs */
.eqs { display: grid; gap: 12px; }
.eq { border-radius: 20px; padding: 16px; background: var(--paper); display: grid; gap: 10px; }
.eq.hl { background: var(--brand-soft); }
.eql { font-size: .78rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.eq.hl .eql { color: var(--brand); }
.eqr { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 900; color: var(--mute); font-size: 1.2rem; }
.eqr i { font-style: normal; font-size: 1rem; color: #1D1B22; padding: 9px 14px; border-radius: 12px; border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); }
/* ---------- pixel grids (CNN lesson) ---------- */
.cnn { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.cnn > div { display: grid; gap: 8px; min-width: 0; }
.cnn .act-lbl { text-align: center; }
.pxg { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 3px; padding: 6px; border-radius: 14px; background: var(--edge); }
.pxg i { aspect-ratio: 1; border-radius: 4px; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: .78rem; font-family: var(--mono); }

.dselbow { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; height: 140px; align-items: end; }

/* ---------- Plain | Technical mode ---------- */
.lp-mode { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 2px solid var(--rule); background: var(--card); color: var(--mute); font-weight: 800; font-size: .84rem; padding: 6px 10px; border-radius: 12px; cursor: pointer; box-shadow: 0 2px 0 var(--rule); }

.lp-mode:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.lp-mode .lm-sw { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--rule); transition: background .2s; }
.lp-mode .lm-sw i { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
.lp-mode .lm-a { color: var(--ink); }
.lp-mode.on .lm-a { color: var(--mute); }
.lp-mode.on .lm-b { color: var(--ink); }
.lp-mode.on .lm-sw { background: var(--c2); }

@media (prefers-reduced-motion: reduce) { .lp-mode .lm-sw, .lp-mode .lm-sw i { transition: none; } }
@media (max-width: 560px) { .lp-mode { padding: 6px 8px; gap: 5px; font-size: .78rem; } .lp-mode .lm-a, .lp-mode .lm-full { display: none; } .lp-mode .lm-short { display: inline; } .lp-top { gap: 10px; padding: 12px 12px; } }
.lp-toast { position: fixed; left: 50%; top: 74px; transform: translate(-50%, -8px); z-index: 30; max-width: min(92vw, 460px); padding: 10px 14px; border-radius: 12px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: .9rem; line-height: 1.35; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.lp-toast.show { opacity: 1; transform: translate(-50%, 0); }
.techp { display: grid; gap: 12px; padding: 16px 18px; border-radius: 18px; background: var(--card); border: 2px solid color-mix(in srgb, var(--c2) 55%, transparent); border-left: 6px solid var(--c2); animation: lp-in .3s ease both; min-width: 0; }

.techp .tph { display: grid; gap: 4px; }
.techp .tpl { width: fit-content; font-size: .68rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: #fff; background: var(--c2); padding: 3px 9px; border-radius: 999px; }
@media (prefers-color-scheme: dark) { .techp .tpl { color: #0E2422; } }
.techp .tph b { font-size: 1.08rem; font-weight: 850; line-height: 1.3; }
.techp .tpf { overflow-x: auto; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--c2) 9%, var(--paper)); font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", Cambria, "Times New Roman", serif; font-size: 1.12rem; line-height: 1.7; color: var(--ink); }
.techp .tpf .fl { display: block; white-space: nowrap; }
.techp .tpf small { font-family: var(--font); font-size: .78rem; color: var(--mute); margin-left: 6px; }
.techp .tpf sub, .techp .tpf sup { font-size: .72em; line-height: 0; }
.techp .tpp { margin: 0; line-height: 1.55; color: var(--ink-2); }
.techp code, .techp .tpp code, .techp .tpn code { font-family: var(--mono); font-size: .86em; background: color-mix(in srgb, var(--ink) 7%, transparent); padding: 1px 5px; border-radius: 5px; }
.techp .tpcode { border-radius: 12px; overflow: hidden; border: 1px solid #2A2833; background: #17161C; min-width: 0; }
.techp .tpbar { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 12px; background: #211F28; border-bottom: 1px solid #2A2833; font-size: .74rem; font-weight: 800; color: #A9A4B4; }
.techp .tplang { color: #E8E4F0; }
.techp .tprun { flex: 1; min-width: 0; font-weight: 700; line-height: 1.3; }
.techp .tprun.ok { color: #5BD69A; }
.techp .tprun.no { color: #FFC23D; }
.techp .tpcopy { flex: none; border: 1px solid #3A3744; background: #2B2934; color: #E8E4F0; border-radius: 8px; padding: 4px 10px; font-size: .74rem; font-weight: 800; cursor: pointer; }
.techp .tpcopy:hover { background: #36333F; }
.techp .tpcode pre { margin: 0; padding: 12px 14px; overflow-x: auto; font-family: var(--mono); font-size: .82rem; line-height: 1.55; color: #E8E4F0; tab-size: 4; }
.techp .tpcode pre code { background: none; padding: 0; font-size: inherit; }
.techp .pk { color: #C792EA; } .techp .ps { color: #C3E88D; } .techp .pn { color: #F78C6C; } .techp .pc { color: #7F7A8C; font-style: italic; } .techp .pf { color: #82AAFF; }
.techp .tpout { border-top: 1px dashed #3A3744; }
.techp .tpout span { display: block; padding: 7px 14px 0; font-size: .66rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: #8F8A9C; }
.techp .tpout pre { padding-top: 4px; color: #BDB8C8; }
.techp .tpn { margin: 0; padding-left: 20px; display: grid; gap: 6px; line-height: 1.5; color: var(--ink-2); }
.techp .tpsrc { margin: 0; font-size: .84rem; line-height: 1.45; color: var(--mute); }
.techp .tpsrc span { font-size: .66rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; margin-right: 8px; }
.techp .tpsrc a { color: inherit; }
@media (max-width: 560px) { .techp { padding: 13px 13px; } .techp .tpf { font-size: 1rem; padding: 10px 11px; } .techp .tpf .fl { white-space: normal; } .techp .tpcode pre { font-size: .76rem; padding: 10px 11px; } }
@media print { .lp-mode, .lp-toast { display: none; } }
.techp .tpf .rad { white-space: nowrap; }

/* ---------- Attention: before attention (RNN, fading, LSTM) ---------- */
.rnn { display: grid; gap: 10px; }
.rnn-words { display: flex; flex-wrap: wrap; gap: 6px; }
.rnn-words span { padding: 4px 9px; border-radius: 8px; background: var(--card); border: 2px solid var(--rule); font-weight: 700; transition: border-color .3s, background .3s; }
.rnn-words span.hot { border-color: var(--ink); background: var(--brand-soft); }
.rnn-sum { min-height: 38px; }
.rnn-sum i { transition: flex .5s; }
.fade { display: grid; gap: 6px; }
.fade-strip { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; height: 34px; }
.fade-strip i { background: var(--c4); border-radius: 3px; }
.fade-ax { display: flex; justify-content: space-between; font-size: .8rem; color: var(--mute); font-weight: 700; }
.lstm { display: grid; gap: 14px; }
.lstm .lane { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; }
.lstm .lane span { font-size: .78rem; font-weight: 800; text-align: center; padding: 7px 2px; border-radius: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: color-mix(in srgb, var(--c4) calc(var(--v) * 100%), var(--card)); border: 1.5px solid var(--rule); }
.lstm .lstm-cell { opacity: .12; transition: opacity .5s; }
.lstm .lstm-cell.on { opacity: 1; }
.lstm .cell-lane span { background: var(--card); transition: background .6s; }
.lstm .cell-lane.on span { background: color-mix(in srgb, var(--c4) calc(var(--v) * 100%), var(--card)); }
.lstm .gate-lane b { font-size: .68rem; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; text-align: center; padding: 3px 0; border-radius: 6px; opacity: 0; transition: opacity .4s; }
.lstm .gate-lane b.on { opacity: 1; }
.lstm .gate-lane .g-w { background: var(--c2); color: #fff; } .lstm .gate-lane .g-k { background: var(--brand-soft); color: var(--ink); } .lstm .gate-lane .g-r { background: var(--c1); color: #fff; }
@media (max-width: 560px) { .lstm .lane span { font-size: .6rem; padding: 6px 0; } .lstm .gate-lane b { font-size: .52rem; } }

/* ---------- CNN: autoencoders, anomalies, mode collapse ---------- */
.aeg { display: grid; grid-template-columns: repeat(8, 1fr); gap: 1px; width: 100%; max-width: 112px; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #1D1B22; border: 2px solid var(--ink); }
.aeg i { display: block; }
.ae-row { display: grid; grid-template-columns: auto repeat(4, minmax(0, 1fr)); gap: 10px; align-items: start; }
.ae-lbls { display: grid; grid-template-rows: auto auto; gap: 0; align-content: start; }
.ae-lbls span { height: 112px; display: flex; align-items: center; font-size: .74rem; font-weight: 800; color: var(--mute); text-transform: uppercase; letter-spacing: .05em; writing-mode: vertical-rl; transform: rotate(180deg); }
.ae-lbls span + span { margin-top: 26px; }
.ae-col { display: grid; justify-items: center; gap: 4px; min-width: 0; }
.ae-arrow { font-size: .78rem; font-weight: 800; color: var(--mute); height: 22px; display: flex; align-items: center; }
.ae-col b { font-size: .84rem; padding: 2px 8px; border-radius: 999px; }
.ae-col b.ok { background: var(--brand-soft); color: var(--ink); } .ae-col b.no { background: color-mix(in srgb, var(--c5) 22%, var(--card)); color: var(--ink); }
.odd { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.odd-c { display: grid; justify-items: center; gap: 6px; padding: 8px; border-radius: 12px; border: 2px solid var(--rule); background: var(--card); min-width: 0; }
.odd-c.flag { border-color: var(--c5); background: color-mix(in srgb, var(--c5) 10%, var(--card)); }
.odd-c .qbar { position: relative; width: 100%; height: 10px; border-radius: 99px; background: var(--rule); overflow: visible; }
.odd-c .qbar i { display: block; height: 100%; border-radius: 99px; background: var(--c1); }
.odd-c .qbar em { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1.5px; background: var(--ink); border-radius: 2px; }
.odd-c small { font-size: .74rem; color: var(--mute); font-weight: 700; }
.odd-c b { font-size: .8rem; }
.odd-c.flag b { color: var(--c5); }
.mc { display: grid; gap: 12px; }
.mc-row { display: grid; grid-template-columns: repeat(4, minmax(0, 96px)); gap: 10px; }
@media (max-width: 560px) { .ae-row { gap: 6px; } .ae-lbls span { height: 64px; font-size: .62rem; } .ae-lbls span + span { margin-top: 26px; } .aeg { max-width: 64px; } .ae-col b { font-size: .7rem; padding: 2px 5px; } .odd { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.lc-key { display: flex; gap: 18px; flex-wrap: wrap; margin: -4px 0 0; font-size: .86rem; font-weight: 700; color: var(--ink-2); }
.lc-key span { display: inline-flex; align-items: center; gap: 7px; }
.lc-key i { display: inline-block; width: 26px; height: 0; border-top: 4px solid var(--c2); }
.lc-key i.k-s { border-top: 4px dashed var(--c3); }
@media (max-width: 560px) { .ae-arrow .ae-n { display: none; } }

/* ---------- course home ---------- */
body { overflow-x: hidden; }
.hm { width: min(1080px, 100%); margin: 0 auto; padding: 18px 22px 80px; display: grid; gap: 34px; }
.hm-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 1.1rem; letter-spacing: -.01em; }
.brand i { width: 40px; height: 40px; border-radius: 13px; background: var(--brand); color: #fff; display: grid; place-items: center; font-style: normal; font-size: .9rem; border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); transform: rotate(-4deg); }
.hm-count { font-weight: 800; color: var(--mute); font-size: .95rem; }
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.hero h1 { font-size: clamp(2.1rem, 5.4vw, 3.4rem); line-height: 1.04; letter-spacing: -.03em; margin: 0 0 14px; font-weight: 900; }
.hero h1 em { font-style: normal; color: var(--brand); }
.hero p { font-size: 1.15rem; line-height: 1.55; color: var(--ink-2); margin: 0 0 22px; max-width: 46ch; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

.hero-card { background: var(--card); border: 2px solid var(--rule); border-radius: 28px; padding: 22px; display: grid; gap: 16px; }
.ring { display: flex; gap: 18px; align-items: center; }
.ring svg { width: 108px; height: 108px; flex: none; }
.ring b { display: block; font-size: 2.2rem; font-weight: 900; letter-spacing: -.02em; }
.ring span { color: var(--ink-2); line-height: 1.4; }
.path3 { display: grid; gap: 8px; }
.path3 div { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; font-weight: 800; font-size: .95rem; }
.path3 i { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-style: normal; font-size: .8rem; color: #1D1B22; border: 2px solid var(--edge); }
.path3 small { color: var(--mute); font-weight: 800; }
.part { display: grid; gap: 14px; }
.part-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.part-h h2 { margin: 0; font-size: 1.5rem; letter-spacing: -.02em; font-weight: 900; }
.part-h span { color: var(--mute); font-weight: 800; font-size: .9rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.mc { text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--card); border: 2px solid var(--rule); border-radius: 22px; padding: 16px; display: grid; grid-template-columns: 58px 1fr; gap: 6px 14px; box-shadow: 0 4px 0 var(--rule); transition: transform .08s, box-shadow .08s, border-color .15s; }
.mc:hover { border-color: var(--ink-2); box-shadow: 0 4px 0 var(--ink-2); }
.mc:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink-2); }
.mc .ic { grid-row: span 3; width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; font-weight: 900; font-size: 1.15rem; color: #1D1B22; border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--edge); }
.mc:nth-child(odd) .ic { transform: rotate(-4deg); } .mc:nth-child(even) .ic { transform: rotate(3deg); }
.mc b { font-size: 1.12rem; letter-spacing: -.01em; line-height: 1.25; }
.mc p { margin: 0; color: var(--ink-2); line-height: 1.45; font-size: .95rem; }
.mc .meta { display: flex; gap: 10px; align-items: center; font-size: .82rem; font-weight: 800; color: var(--mute); }
.mc .bar { flex: 1; height: 8px; border-radius: 6px; background: var(--rule); overflow: hidden; }
.mc .bar i { display: block; height: 100%; background: var(--brand); border-radius: 6px; }
.mc .st { font-weight: 900; }
.mc.done { border-color: var(--ok); box-shadow: 0 4px 0 var(--ok); }
.mc.done .st { color: var(--ok); }
.mc.next { border-color: var(--brand); box-shadow: 0 4px 0 var(--brand); }
.mc.final { grid-column: 1 / -1; background: var(--ink); color: var(--paper); border-color: var(--edge); box-shadow: 0 4px 0 var(--edge); }
.mc.final p, .mc.final .meta { color: color-mix(in srgb, var(--paper) 72%, transparent); }
.mc.final .bar { background: color-mix(in srgb, var(--paper) 22%, transparent); }
.hm-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; color: var(--mute); font-size: .88rem; border-top: 2px solid var(--rule); padding-top: 18px; }
.hm-foot button { border: 0; background: none; color: var(--mute); font: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; }
/* full-screen lesson */
.stage { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: none; }
.stage.on { display: block; animation: lp-in .25s ease both; }
.stage iframe { width: 100%; height: 100%; border: 0; display: block; }
body.lesson-open { overflow: hidden; }
/* celebration */
.toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 140%); z-index: 60; background: var(--card); border: 2px solid var(--edge); box-shadow: 0 5px 0 var(--edge); border-radius: 20px; padding: 14px 18px; display: flex; gap: 14px; align-items: center; max-width: min(520px, calc(100% - 28px)); transition: transform .35s cubic-bezier(.2, 1.4, .4, 1); }
.toast:not(.on) { visibility: hidden; transition: transform .35s, visibility 0s .35s; }
.toast.on { transform: translate(-50%, 0); }
.toast i { font-style: normal; width: 46px; height: 46px; flex: none; border-radius: 14px; background: var(--c4); display: grid; place-items: center; font-size: 1.4rem; border: 2px solid var(--edge); }
.toast b { display: block; font-size: 1.05rem; } .toast span { color: var(--ink-2); font-size: .95rem; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 59; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 3px; animation: fall 1.6s cubic-bezier(.3, .6, .5, 1) forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); opacity: .9; } }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } .toast { transition: none; } }
.paths { display: grid; gap: 14px; }
.pcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.pc { text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--card); border: 2px solid var(--rule); border-radius: 20px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; box-shadow: 0 4px 0 var(--rule); }
.pc:hover { border-color: var(--edge); }
.pc.on { border-color: var(--brand); box-shadow: 0 4px 0 var(--brand); background: var(--brand-soft); }
.pc .pct { font-weight: 900; font-size: 1.08rem; display: flex; align-items: center; gap: 8px; }
.pc.on .pct::after { content: "✓"; font-size: .8rem; color: #fff; background: var(--brand); width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; }
.pc .pm { font-weight: 800; font-size: .86rem; color: var(--brand); }
.pc .pd { font-size: .92rem; color: var(--ink-2); line-height: 1.4; }
.pc:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.mc.off { opacity: .55; box-shadow: none; }
.mc.off:hover { opacity: .85; }
@media (max-width: 760px) { .pcards { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .hm { padding: 14px 16px 60px; gap: 28px; } .cards { grid-template-columns: 1fr; } .mc .ic { width: 50px; height: 50px; } .mc { grid-template-columns: 50px 1fr; } }
.hero-mode { margin: 10px 0 0; font-size: .95rem; line-height: 1.5; color: var(--mute); }
.hero-mode b { color: var(--ink-2); }
.hm-top { justify-content: flex-start; }
.hm-top .hm-count { margin-left: auto; }
.hm-top .lp-mode { margin-left: 6px; }
@media (max-width: 560px) { .hm-top .hm-count { font-size: .8rem; } }
</style>
</head>
<body>
<div class="hm">
  <header class="hm-top"><div class="brand"><i aria-hidden="true">AI</i>How AI Works</div><span class="hm-count" id="count"></span><button type="button" class="lp-mode" id="mode" role="switch" aria-checked="false" aria-label="Technical mode: show formulas and Python in lessons" title="Technical mode adds formulas and Python to key slides"><span class="lm-a" aria-hidden="true">Plain</span><span class="lm-sw" aria-hidden="true"><i></i></span><span class="lm-b" aria-hidden="true"><span class="lm-full">Technical</span><span class="lm-short">Tech</span></span></button></header>
  <section class="hero">
    <div>
      <h1>Learn how AI really works, <em>by doing it.</em></h1>
      <p>23 hands-on lessons and a final test. Train a model, slide a filter across a picture, build a brief. No maths or code needed.</p>
      <p class="hero-mode" id="modeNote"></p>
      <div class="hero-cta"><button type="button" class="btn3d primary" id="cta"></button><small id="ctaNote"></small></div>
    </div>
    <div class="hero-card" id="summary"></div>
  </section>
  <section class="paths" id="paths"></section>
  <div id="parts" style="display:grid;gap:34px"></div>
  <footer class="hm-foot"><span>Your progress is saved in this browser only.</span><button type="button" id="reset">Reset my progress</button></footer>
</div>
<div class="stage" id="stage" role="dialog" aria-modal="true" aria-label="Lesson"><iframe id="frame" title="Lesson"></iframe></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const MODULES = [
    { id: 'machine-learning', part: 0, title: 'Machine learning', blurb: 'Build a spam filter, predict which customers leave, see why every learner makes assumptions, and segment accounts.', min: 28 },
    { id: 'neural-networks', part: 0, title: 'Neural networks', blurb: 'Tune a neuron, add the switch, follow one customer forward and back, and meet the frameworks engineers build with.', min: 18 },
    { id: 'cnn', part: 0, title: 'Image AI (CNNs)', blurb: 'See how filters find edges, why augmentation and transfer learning work, meet RNNs and transformers, spot damaged boxes with an autoencoder, and watch GANs and diffusion make new images.', min: 38 },
    { id: 'nlp', part: 0, title: 'Language AI (NLP)', blurb: 'Sort emails, pull out order details, turn words into numbers, and tune a complaint detector.', min: 22 },
    { id: 'ds-explore', part: 1, title: 'Exploring data', blurb: 'Catch bad data before it fools a report, then typical values and spread, histograms and boxplots, and why a link isn’t a cause.', min: 33 },
    { id: 'ds-sampling', part: 1, title: 'Samples and uncertainty', blurb: 'Survey bias, what “70% likely” really means, regression to the mean, standard errors, the bootstrap and common shapes of data.', min: 29 },
    { id: 'ds-experiments', part: 1, title: 'Experiments and significance', blurb: 'Fair A/B tests and why small ones fool you, p-values, the two kinds of error, multiple testing, bandits and sample size.', min: 28 },
    { id: 'ds-regression', part: 1, title: 'Regression', blurb: 'Number, category or groups? Then fit a line by hand, judge it on new data, avoid extrapolation, and check for trouble.', min: 31 },
    { id: 'ds-classification', part: 1, title: 'Classification', blurb: 'Naive Bayes, support vector machines, logistic regression and odds, whether “70%” is really 70%, confusion matrices, ROC and costs.', min: 29 },
    { id: 'ds-ml', part: 1, title: 'Statistical machine learning', blurb: 'Scaling for nearest neighbours, a yes/no tree you build yourself, random forests, gradient boosting and tuning.', min: 28 },
    { id: 'ds-unsupervised', part: 1, title: 'Unsupervised learning', blurb: 'Principal components, k-means step by step, hierarchical and model-based clustering, mixed data, and choosing a method.', min: 28 },
    { id: 'tokenization', part: 2, title: 'Tokenization', blurb: 'How a model cuts text into tokens, and why some languages cost more.', min: 18 },
    { id: 'embeddings', part: 2, title: 'Embeddings', blurb: 'Give words addresses on a meaning map, see why context changes them, and pick keyword or meaning search.', min: 24 },
    { id: 'attention', part: 2, title: 'Attention', blurb: 'Why reading word by word made long texts hard, how each word looks at the others, why chat models only look back, steer it yourself with query, key and value, and what an attention picture can’t tell you.', min: 25 },
    { id: 'transformer', part: 2, title: 'Inside a transformer', blurb: 'Word order, residual connections, layer norm, feed-forward memories, and the whole model, box by box, from your text to the next token.', min: 21 },
    { id: 'generation', part: 2, title: 'Generation', blurb: 'Write one token at a time, set the temperature, top-k and top-p, see what drives wait and cost, and why fluent can be wrong.', min: 26 },
    { id: 'training', part: 2, title: 'Training', blurb: 'Step down the error valley, then pretraining, fine-tuning and alignment, and the sycophancy trap.', min: 22 },
    { id: 'reasoning', part: 2, title: 'Reasoning models', blurb: 'Why written steps help a model, what thinking costs, and why the working is not a window.', min: 22 },
    { id: 'using', part: 3, title: 'Using AI at work', blurb: 'Pick the right jobs, write a strong brief, check drafts, queries and extracted data.', min: 20 },
    { id: 'improving', part: 3, title: 'Making AI better', blurb: 'Prompts, RAG, CAG, fine-tuning and tools, plus the app around the model and keeping API keys safe.', min: 21 },
    { id: 'agents', part: 3, title: 'Agents', blurb: 'How a model uses tools, the agent loop, workflow or agent, and keeping access tight.', min: 22 },
    { id: 'choosing', part: 3, title: 'Choosing models', blurb: 'LLM or not, kinds of models, licences, and testing models on what matters for your work.', min: 22 },
    { id: 'responsible', part: 3, title: 'Safe and responsible use', blurb: 'Check facts, protect data, spot planted instructions, and match every risk to a control.', min: 19 },
    { id: 'final', part: 4, title: 'Final test', blurb: '', min: 32 }
  ];
  const PARTS = [['Foundations', 'How machines learn'], ['Data science', 'Statistics and machine learning for data'], ['Inside a language model', 'From text to answers'], ['Putting AI to work', 'Use it well, use it safely'], ['Check your learning', '']];
  const COLS = ['var(--c4)', 'var(--c2)', 'var(--c5)', 'var(--c3)', 'var(--c1)'];
  const KEY = 'how-ai-works-progress-v1';
  let P = {};
  try { P = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { P = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  // Learning paths. Essentials keeps the six lessons most staff need at work; its test uses only questions on those lessons.
  const PATHS = {
    essentials: { t: 'Essentials', d: 'The six lessons most people need at work, and a short test on them.', ids: ['machine-learning', 'generation', 'using', 'improving', 'agents', 'responsible'], q: 19, fmin: 15 },
    data: { t: 'Data science', d: 'How machines learn, then the seven data science lessons, with a test on them.', ids: ['machine-learning', 'ds-explore', 'ds-sampling', 'ds-experiments', 'ds-regression', 'ds-classification', 'ds-ml', 'ds-unsupervised'], q: 16, fmin: 13 },
    complete: { t: 'Complete course', d: 'All 23 lessons, from how machines learn and data science to using AI safely, and the full final test.', ids: null, q: 50, fmin: 36 }
  };
  // The old Deep dive path became Technical mode: the complete course with formulas, code and every More detail open.
  if (P.path === 'deep') { P.path = 'complete'; P.tech = true; save(); }
  if (P.tech === undefined) { try { P.tech = localStorage.getItem('howai-tech') === '1'; } catch (e) { P.tech = false; } }
  let path = PATHS[P.path] ? P.path : 'complete';
  const inPath = m => m.id === 'final' || !PATHS[path].ids || PATHS[path].ids.includes(m.id);
  const lessonsAll = MODULES.filter(m => m.id !== 'final');
  const lessonsIn = () => lessonsAll.filter(inPath);
  const minOf = m => m.id === 'final' ? PATHS[path].fmin : m.min;
  const pathMin = k => { const P0 = PATHS[k]; return lessonsAll.filter(m => !P0.ids || P0.ids.includes(m.id)).reduce((t, m) => t + m.min, 0) + P0.fmin; };
  const hrs = n => { const h = Math.round(n / 30) / 2; return `${h} hour${h === 1 ? '' : 's'}`; };
  const stateOf = m => { const p = P[m.id] || {}; return p.done ? 'done' : p.step > 1 ? 'going' : 'new'; };
  const nextUp = () => { const ms = MODULES.filter(inPath); return ms.find(m => stateOf(m) === 'going') || ms.find(m => stateOf(m) !== 'done') || null; };

  function render() {
    const lessons = lessonsIn(), done = lessons.filter(m => stateOf(m) === 'done').length, nx = nextUp();
    MODULES[MODULES.length - 1].blurb = path === 'essentials' || path === 'data' ? `${PATHS[path].q} questions on your ${PATHS[path].t} lessons, one try each. Pass with 80% and print your completion record.` : `${PATHS[path].q} questions across the whole course, including new situations, one try each. Pass with 80% and print your completion record.`;
    $('#count').textContent = `${done} of ${lessons.length} lessons done`;
    $('#paths').innerHTML = `<div class="part-h"><h2>Choose your path</h2><span>Switch any time: your progress is kept.</span></div><div class="pcards" role="radiogroup" aria-label="Learning path">${Object.entries(PATHS).map(([k, q]) => `<button type="button" class="pc${k === path ? ' on' : ''}" role="radio" aria-checked="${k === path}" data-path="${k}"><span class="pct">${q.t}</span><span class="pm">About ${hrs(pathMin(k))} · ${q.ids ? q.ids.length : lessonsAll.length} lessons</span><span class="pd">${q.d}</span></button>`).join('')}</div>`;
    const cta = $('#cta');
    if (!nx) { cta.textContent = 'Review any lesson'; cta.dataset.open = 'machine-learning'; $('#ctaNote').textContent = 'Course complete. Well done!'; }
    else { const n = MODULES.indexOf(nx) + 1; cta.dataset.open = nx.id; cta.textContent = stateOf(nx) === 'going' ? `Continue: ${nx.title}` : done || (P.final || {}).done ? `Start: ${nx.title}` : `Start: ${nx.title}`; $('#ctaNote').textContent = nx.id === 'final' ? `About ${PATHS[path].fmin} minutes` : `Lesson ${n} · about ${nx.min} min`; }
    const pct = done / lessons.length, R = 46, C = 2 * Math.PI * R;
    $('#summary').innerHTML = `<div class="ring"><svg viewBox="0 0 108 108" aria-hidden="true"><circle cx="54" cy="54" r="${R}" fill="none" stroke="var(--rule)" stroke-width="12"/><circle cx="54" cy="54" r="${R}" fill="none" stroke="var(--brand)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" transform="rotate(-90 54 54)"/></svg><div><b>${Math.round(pct * 100)}%</b><span>${done ? `${done} lesson${done === 1 ? '' : 's'} complete${(P.final || {}).done ? ' and the final test taken' : ''}.` : `${PATHS[path].t}: about ${hrs(pathMin(path))} in total. Every lesson saves your place.`}</span></div></div>
      <div class="path3">${PARTS.slice(0, PARTS.length - 1).map(([t], k) => { const ms = lessons.filter(m => m.part === k); if (!ms.length) return ''; return `<div><i style="background:${COLS[k]}">${k + 1}</i><span>${t}</span><small>${ms.filter(m => stateOf(m) === 'done').length}/${ms.length}</small></div>`; }).join('')}</div>`;
    let num = 0;
    $('#parts').innerHTML = PARTS.map(([t, sub], k) => `<section class="part"><div class="part-h"><h2>${k < PARTS.length - 1 ? `Part ${k + 1} · ` : ''}${t}</h2>${sub ? `<span>${sub}</span>` : ''}</div><div class="cards">${MODULES.filter(m => m.part === k).map(m => {
        const p = P[m.id] || {}, s = stateOf(m), n = m.id === 'final' ? '✓' : String(++num).padStart(2, '0');
        const prog = s === 'done' ? 1 : p.total ? Math.min(1, (p.step - 1) / p.total) : 0;
        const off = !inPath(m);
        const status = off && s !== 'done' ? `<span>Optional · ${m.min} min</span>` : s === 'done' ? `<span class="st">${m.id === 'final' ? (p.pass ? 'Passed' : 'Taken') : 'Done'}${p.score !== undefined ? ` · ${p.score}/${p.of}` : ''}</span>` : s === 'going' ? `<span class="st">${Math.round(prog * 100)}%</span>` : `<span>${minOf(m)} min</span>`;
        return `<button type="button" class="mc${s === 'done' ? ' done' : ''}${off ? ' off' : ''}${nx && nx.id === m.id ? ' next' : ''}${m.id === 'final' ? ' final' : ''}" data-open="${m.id}"><span class="ic" style="background:${COLS[(num || 4) % 5]}">${n}</span><b>${esc(m.title)}</b><p>${esc(m.blurb)}</p><span class="meta"><span class="bar"><i style="width:${prog * 100}%"></i></span>${status}</span></button>`;
      }).join('')}</div></section>`).join('');
  }

  // ---------- full-screen lessons ----------
  const stage = $('#stage'), frame = $('#frame');
  let current = null, lastFocus = null;
  function open(id) {
    const m = MODULES.find(x => x.id === id); if (!m) return;
    const p = P[id] || {};
    current = id; lastFocus = document.activeElement;
    const q = new URLSearchParams({ tech: P.tech ? '1' : '0' });
    if (id === 'final' && (path === 'essentials' || path === 'data')) q.set('path', path);
    const qs = '?' + q.toString();
    frame.src = `modules/${id}.html${qs}${!p.done && p.step > 1 ? '#' + p.step : ''}`;
    stage.classList.add('on'); document.body.classList.add('lesson-open');
    setTimeout(() => { try { frame.focus(); } catch (e) {} }, 60);
  }
  function close() {
    stage.classList.remove('on'); document.body.classList.remove('lesson-open');
    frame.src = 'about:blank'; current = null; render();
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  function celebrate(m, p) {
    const fin = m.id === 'final';
    $('#toast').innerHTML = `<i aria-hidden="true">${fin && p.pass ? '★' : '✓'}</i><div><b>${fin ? (p.pass ? (p.path === 'essentials' ? 'You passed the Essentials test!' : p.path === 'data' ? 'You passed the Data science test!' : 'You passed the final test!') : 'Final test complete') : `${m.title}: complete!`}</b><span>${p.score}/${p.of} right on the first try${nextUp() ? ` · Up next: ${nextUp().title}` : ''}</span></div>`;
    $('#toast').classList.add('on'); setTimeout(() => $('#toast').classList.remove('on'), 4200);
    const box = document.createElement('div'); box.className = 'confetti';
    box.innerHTML = [...Array(70)].map(() => `<i style="left:${Math.random() * 100}%;background:${COLS[Math.floor(Math.random() * 5)]};--dx:${(Math.random() - .5) * 240}px;--r:${Math.random() * 720 - 360}deg;animation-delay:${Math.random() * .4}s"></i>`).join('');
    document.body.appendChild(box); setTimeout(() => box.remove(), 2400);
  }
  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || d.source !== 'ai-module' || e.source !== frame.contentWindow) return;
    const m = MODULES.find(x => x.id === d.module); if (!m) return;
    const p = P[m.id] = P[m.id] || {};
    if (d.type === 'progress') { if (!p.done) { p.step = d.step; p.total = d.total; } save(); }
    else if (d.type === 'complete') { p.done = true; p.score = d.score; p.of = d.total; if (m.id === 'final') { p.pass = d.total ? d.score / d.total >= 0.8 : false; p.path = path === 'essentials' || path === 'data' ? path : 'complete'; } p.step = 1; save(); close(); celebrate(m, p); }
    else if (d.type === 'mode') { P.tech = !!d.tech; save(); setMode(); }
    else if (d.type === 'exit') close();
    else if (d.type === 'open') { close(); open(d.target); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && current) close(); });
  document.addEventListener('click', e => {
    const pb = e.target.closest('[data-path]'); if (pb && !current) { path = pb.dataset.path; P.path = path; save(); render(); return; }
    const b = e.target.closest('[data-open]'); if (b && !current) open(b.dataset.open); });
  const modeBtn = $('#mode');
  function setMode() {
    modeBtn.setAttribute('aria-checked', P.tech ? 'true' : 'false'); modeBtn.classList.toggle('on', !!P.tech);
    $('#modeNote').innerHTML = P.tech ? '<b>Technical mode is on.</b> Lessons add a formula, runnable Python and the precise caveats to about five slides each, and open every “More detail”.' : 'Comfortable with formulas or code? Switch on <b>Technical</b> (top right) to add them to about five slides per lesson.';
  }
  modeBtn.addEventListener('click', () => { P.tech = !P.tech; save(); try { localStorage.setItem('howai-tech', P.tech ? '1' : '0'); } catch (e) {} setMode(); });
  setMode();
  $('#reset').addEventListener('click', () => { if (confirm('Reset your progress for every lesson?')) { P = {}; save(); render(); } });
  render();
})();
</script>
</body>
</html>
